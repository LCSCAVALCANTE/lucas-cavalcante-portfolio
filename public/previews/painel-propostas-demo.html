<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Propostas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  body { margin: 0; background: #ece9e4; padding: 18px; }
  .pbx { --ac:#E8830F; --ac-d:#cf7400; --ac-soft:rgba(232,131,15,.14); --ac-tint:#fdf1e3; --ac-text:#9a5a06;
         font-family: "Segoe UI", system-ui, sans-serif; color: #2b2a28; background: #f4f2ef; border: 1px solid #e3ded7; border-radius: 14px; overflow: hidden; max-width: 1520px; margin: 0 auto; box-shadow: 0 10px 30px rgba(80,50,10,.08); }
  .pbx * { box-sizing: border-box; }
  .pbx .gate { min-height: 520px; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 120% at 50% 0%, #fff 0%, #faf7f2 60%, #f4ede2 100%); padding: 24px; }
  .pbx .gate-card { width: 340px; background: #fff; border: 1px solid #efe7da; border-radius: 16px; padding: 32px 28px; box-shadow: 0 12px 34px rgba(120,70,10,.12); text-align: center; }
  .pbx .gate-card img.logo { width: 170px; height: auto; margin: 0 auto 6px; display: block; }
  .pbx .gate-sub { color: #8a8378; font-size: 12.5px; margin: 0 0 18px; }
  .pbx label { display: block; font-size: 12px; color: #8a8378; margin: 12px 0 5px; text-align: left; }
  .pbx input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d9d2c7; border-radius: 9px; font-size: 14px; background: #fff; color: #2b2a28; transition: border-color .15s, box-shadow .15s; }
  .pbx input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
  .pbx .btn { width: 100%; height: 42px; margin-top: 20px; background: var(--ac); color: #fff; border: 0; border-radius: 9px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s, transform .08s; }
  .pbx .btn:hover { background: var(--ac-d); }
  .pbx .btn:active { transform: scale(.985); }
  .pbx .btn:disabled { opacity: .6; cursor: default; }
  .pbx .err { color: #b3261e; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .pbx .hint { margin-top: 16px; font-size: 12px; color: #a59c8d; border-top: 1px solid #f1ece3; padding-top: 13px; }
  .pbx .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: #fff; border-bottom: 1px solid #eee6da; flex-wrap: wrap; }
  .pbx .hdr-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .pbx .hdr-l img.logo { height: 34px; width: auto; }
  .pbx .hdr-l b { font-size: 14.5px; font-weight: 500; color: #4a443c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbx .hdr-r { display: flex; align-items: center; gap: 8px; }
  .pbx .chip { display: inline-flex; align-items: center; gap: 7px; background: #faf7f2; border: 1px solid #eee6da; border-radius: 22px; padding: 5px 12px 5px 6px; font-size: 13px; }
  .pbx .chip .av { width: 24px; height: 24px; border-radius: 50%; background: var(--ac); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .pbx .lo { background: none; border: 0; color: #8a8378; cursor: pointer; font-size: 18px; padding: 5px; border-radius: 8px; transition: background .15s, color .15s; }
  .pbx .lo:hover { color: var(--ac); background: var(--ac-soft); }
  .pbx .inbox-ico { display: inline-block; position: relative; width: 20px; height: 17px; vertical-align: middle; }
  .pbx .inbox-ico::before { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 11px; border: 1.8px solid #E8830F; border-radius: 2px; }
  .pbx .inbox-ico::after { content: ''; position: absolute; top: 0; left: 4px; right: 4px; height: 10px; border: 1.8px solid #E8830F; border-bottom: 0; border-radius: 2px 2px 0 0; background: #fff; }
  @keyframes inbox-pulse { 0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(232,131,15,0); } 50%{ transform:scale(1.13); box-shadow:0 0 0 5px rgba(232,131,15,.18); } }
  .pbx .lo-pulse { animation: inbox-pulse 2.2s ease-in-out infinite; border-radius: 8px; }
  .pbx .fbar { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 12px 18px; background: #fcfbf9; border-bottom: 1px solid #eee6da; }
  .pbx .fld { display: flex; flex-direction: column; gap: 4px; }
  .pbx .fld > span { font-size: 11px; color: #a59c8d; font-weight: 500; }
  .pbx select.uni, .pbx input.dt { height: 34px; border: 1px solid #d9d2c7; border-radius: 9px; font-size: 13px; padding: 0 10px; background: #fff; color: #2b2a28; font-family: inherit; width: auto; }
  .pbx .mfin { width: 220px; height: 34px; border: 1px solid #d9d2c7; border-radius: 9px; font-size: 13px; padding: 0 10px; background: #fff; color: #2b2a28; }
  .pbx .lock { height: 34px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #4a443c; padding: 0 6px; }
  .pbx .daterange { display: flex; align-items: center; gap: 7px; }
  .pbx .daterange small { color: #a59c8d; }
  .pbx .canvas { padding: 16px 18px; }
  .pbx .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px,1fr)); gap: 12px; margin-bottom: 16px; }
  .pbx .kpi .ic { font-size: 22px; line-height: 1; }
  .pbx .kpi { background: #fff; border: 1px solid #eee6da; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 13px; box-shadow: 0 1px 3px rgba(80,50,10,.05); transition: transform .12s, box-shadow .12s; }
  .pbx .kpi:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(80,50,10,.09); }
  .pbx .kpi .ic { width: 42px; height: 42px; border-radius: 11px; background: var(--ac-soft); color: var(--ac); display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; }
  .pbx .kpi .val { font-size: 21px; font-weight: 600; color: #2b2a28; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pbx .kpi .lbl { font-size: 12px; color: #8a8378; margin-top: 3px; }
  .pbx .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px,1fr)); gap: 16px; margin-bottom: 16px; }
  .pbx .visual { background: #fff; border: 1px solid #eee6da; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(80,50,10,.05); margin-bottom: 16px; }
  .pbx .grid2 .visual { margin-bottom: 0; }
  .pbx .visual-h { font-size: 14px; font-weight: 500; color: #4a443c; padding: 13px 16px 9px; display: flex; align-items: center; gap: 7px; }
  .pbx .visual-h i { color: var(--ac); font-size: 16px; }
  .pbx .visual-h small { color: #a59c8d; font-weight: 400; }
  .pbx table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .pbx thead th { text-align: left; font-size: 11px; color: #a59c8d; font-weight: 500; padding: 7px 14px; border-bottom: 1px solid #eee6da; }
  .pbx thead th.num { text-align: right; }
  .pbx tbody td { padding: 0 14px; height: 30px; border-bottom: 1px solid #f5f1ea; }
  .pbx tbody td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pbx thead th.num { white-space: nowrap; }
  .pbx tbody tr:hover td { background: #fdfbf8; }
  .pbx .barcell { position: relative; }
  .pbx .bar { position: absolute; left: 0; top: 5px; bottom: 5px; background: var(--ac-soft); border-radius: 3px; }
  .pbx .barcell span { position: relative; }
  .pbx .pct { color: var(--ac-text); font-weight: 600; }
  .pbx .total td { border-top: 1.5px solid #e3ded7; border-bottom: 0; font-weight: 600; background: #fcfaf7; height: 34px; }
  .pbx tr.grp { cursor: pointer; }
  .pbx tr.grp td { font-weight: 500; border-top: 1px solid #f1ece3; }
  .pbx tr.grp td i { color: var(--ac); font-size: 14px; margin-right: 6px; }
  .pbx tr.grp:hover td { background: #fdf6ee; }
  .pbx td.ind { padding-left: 32px; color: #8a8378; }
  .pbx tr.day td { color: #8a8378; height: 28px; }
  .pbx .subh { font-size: 12px; font-weight: 600; color: #6e675c; padding: 11px 14px 4px; border-top: 1px solid #f3eee6; }
  .pbx .subh small { font-weight: 400; color: #b8ad9c; }
  .pbx .mchip { font-size: 12px; padding: 6px 12px; border: 1px solid #d9d2c7; border-radius: 18px; cursor: pointer; color: #6e675c; background: #fff; transition: all .12s; }
  .pbx .mchip:hover { border-color: var(--ac); }
  .pbx .mchip.on { background: var(--ac-tint); border-color: var(--ac); color: var(--ac-text); font-weight: 500; }
  .pbx .months { display: flex; gap: 6px; flex-wrap: wrap; }
  .pbx .seg { display: flex; border: 1px solid #d9d2c7; border-radius: 9px; overflow: hidden; height: 34px; }
  .pbx .seg button { border: 0; background: #fff; color: #6e675c; font-size: 12.5px; padding: 0 14px; cursor: pointer; border-right: 1px solid #e7e0d6; font-family: inherit; transition: background .12s; }
  .pbx .seg button:last-child { border-right: 0; }
  .pbx .seg button.on { background: var(--ac); color: #fff; font-weight: 500; }
  .pbx .tabs { display: flex; gap: 4px; padding: 8px 14px; background: #fff; border-top: 1px solid #eee6da; flex-wrap: wrap; }
  .pbx .tab { font-size: 12.5px; color: #6e675c; padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: background .12s; }
  .pbx .tab:hover { background: #faf7f2; }
  .pbx .tab.active { background: var(--ac-tint); color: var(--ac-text); font-weight: 500; }
  .pbx .chartbox { position: relative; padding: 4px 12px 14px; }
  .pbx .body { display: flex; align-items: stretch; }
  .pbx .side { width: 234px; flex-shrink: 0; background: #fff; border-right: 1px solid #eee6da; padding: 14px 12px; }
  .pbx .side-t { font-size: 11px; font-weight: 600; color: #b8ad9c; text-transform: uppercase; letter-spacing: .5px; padding: 4px 12px 9px; }
  .pbx .nav { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 10px; font-size: 13.5px; color: #6e675c; cursor: pointer; transition: background .12s, color .12s; margin-bottom: 3px; }
  .pbx .nav i { font-size: 19px; color: #b8ad9c; }
  .pbx .nav:hover { background: #faf7f2; }
  .pbx .nav.active { background: var(--ac-tint); color: var(--ac-text); font-weight: 500; }
  .pbx .nav.active i { color: var(--ac); }
  .pbx .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  @media (max-width: 760px) {
    .pbx .body { flex-direction: column; }
    .pbx .side { width: auto; display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid #eee6da; padding: 8px 10px; }
    .pbx .side-t { display: none; }
    .pbx .nav { white-space: nowrap; margin-bottom: 0; }
  }
  @media (max-width: 560px) {
    body { padding: 8px; }
    .pbx .hdr-l b { font-size: 12.5px; white-space: normal; }
    .pbx .canvas { padding: 12px; }
  }
</style>
</head>
<body>
<div class="pbx" id="pbx-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // MODO DEMO: preview publico do portfolio. Nenhuma chamada de rede real
  // acontece aqui - todos os dados abaixo sao gerados no navegador so para
  // esta demonstracao. A logica de agregacao, filtros, graficos e
  // drill-down e a mesma do painel de producao; só a fonte dos dados muda.
  const AC = "#E8830F";
  const DEMO_UNIDADES = ["Unidade Centro", "Unidade Sul", "Unidade Norte"];
  const DEMO_PROFISSIONAIS = ["Ana Souza", "Bruno Lima", "Camila Rocha", "Diego Alves", "Elaine Prado"];
  const DEMO_PROCEDIMENTOS = ["Procedimento A", "Procedimento B", "Procedimento C", "Procedimento D"];
  const DEMO_PACOTES = ["Pacote Basico", "Pacote Premium", "Pacote Anual"];
  function seededRandom(seed){ let s = seed % 2147483647; if(s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
  const demoRnd = seededRandom(42);
  function buildDemoEvents(){
    const events = []; const today = new Date();
    for(let i = 0; i < 150; i++){
      const d = new Date(today); d.setDate(d.getDate() - i);
      const dia = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      DEMO_UNIDADES.forEach(unidade => {
        const n = 1 + Math.floor(demoRnd()*4);
        for(let j = 0; j < n; j++){
          const r = demoRnd();
          const status = r<0.55 ? "Executada" : r<0.78 ? "Aguardando aprovação" : r<0.85 ? "Aprovada pelo cliente" : "Rejeitada";
          const profissional = DEMO_PROFISSIONAIS[Math.floor(demoRnd()*DEMO_PROFISSIONAIS.length)];
          const procedimento = DEMO_PROCEDIMENTOS[Math.floor(demoRnd()*DEMO_PROCEDIMENTOS.length)];
          const pacote = demoRnd() < 0.3 ? DEMO_PACOTES[Math.floor(demoRnd()*DEMO_PACOTES.length)] : null;
          const valor = Math.round((800 + demoRnd()*3600) * 100) / 100;
          events.push({ unidade, status, profissional, procedimento, pacote, dia, valor });
        }
      });
    }
    return events;
  }
  const DEMO_EVENTS = buildDemoEvents();
  function demoGroup(rows, keys, valueFn){
    const map = {};
    rows.forEach(r => {
      const k = keys.map(k2 => r[k2]).join("||");
      if(!map[k]) map[k] = Object.assign({}, Object.fromEntries(keys.map(k2 => [k2, r[k2]])), { valor:0, qtd_propostas:0, qtd_itens:0, qtd:0 });
      map[k].valor += valueFn(r); map[k].qtd_propostas += 1; map[k].qtd_itens += 1; map[k].qtd += 1;
    });
    return Object.values(map);
  }
  const DEMO_VIEWS = {
    vw_dia: demoGroup(DEMO_EVENTS, ["unidade","status","dia"], r=>r.valor).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, dia:r.dia, valor:r.valor, qtd_propostas:r.qtd_propostas, qtd_itens:r.qtd_itens })),
    vw_prof_dia: demoGroup(DEMO_EVENTS, ["unidade","status","profissional","dia"], r=>r.valor).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, profissional_proposta:r.profissional, dia:r.dia, valor:r.valor })),
    vw_proc_dia: demoGroup(DEMO_EVENTS, ["unidade","status","procedimento","dia"], r=>r.valor).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, nome_procedimento:r.procedimento, dia:r.dia, valor:r.valor })),
    vw_pacote_dia: demoGroup(DEMO_EVENTS.filter(r=>r.pacote), ["unidade","status","pacote","dia"], r=>r.valor).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, nome_pacote:r.pacote, dia:r.dia, valor:r.valor })),
    vw_prof_proc: demoGroup(DEMO_EVENTS, ["unidade","status","profissional","dia","procedimento"], r=>r.valor).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, profissional_proposta:r.profissional, dia:r.dia, nome_procedimento:r.procedimento, valor:r.valor, qtd:r.qtd })),
    vw_dia_proposta: demoGroup(DEMO_EVENTS, ["unidade","status","dia"], r=>r.valor*1.12).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, dia:r.dia, valor:r.valor })),
    vw_prof_dia_proposta: demoGroup(DEMO_EVENTS, ["unidade","status","profissional","dia"], r=>r.valor*1.12).map(r => ({ unidade_nome:r.unidade, status_proposta:r.status, profissional_proposta:r.profissional, dia:r.dia, valor:r.valor }))
  };
  const { useState, useEffect } = React;
  const html = htm.bind(React.createElement);

  const brl = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const brl0 = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
  const pct = p => p.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
  const MLBL = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const fmtD = s => { const p = s.split("-").map(Number); const dt = new Date(p[0],p[1]-1,p[2]); const wd = ["dom","seg","ter","qua","qui","sex","sáb"][dt.getDay()]; return wd+" "+String(p[2]).padStart(2,"0")+"/"+String(p[1]).padStart(2,"0"); };
  const ddmm = s => s.slice(8,10)+"/"+s.slice(5,7);
  const monthLbl = ym => { const [y,m] = ym.split("-"); return MLBL[+m-1]+"/"+y.slice(2); };
  const periodDays = (pmode, months, de, ate, calMin, calMax) => {
    const out = [];
    const push = (f0, t0) => {
      let f = f0 < calMin ? calMin : f0, t = t0 > calMax ? calMax : t0;
      if(f > t) return;
      let d = new Date(f+"T00:00:00"); const end = new Date(t+"T00:00:00");
      while(d <= end){ out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")); d.setDate(d.getDate()+1); }
    };
    if(pmode === "mes"){ months.forEach(ym => { const [y,m] = ym.split("-").map(Number); const last = new Date(y, m, 0).getDate(); push(ym+"-01", ym+"-"+String(last).padStart(2,"0")); }); }
    else { push(de, ate); }
    return out;
  };

  // Status sempre vazio na origem (nunca tem proposta de verdade) - some
  // do painel inteiro (filtro, gráficos, tabelas) direto na leitura dos
  // dados, pra não precisar filtrar em cada lugar separado.
  const STATUS_OCULTOS = ["Aprovada pelo cliente"];

  // orderCols: colunas pra ordenar de forma 100% determinística - sem isso,
  // paginar em lotes (range) pode perder ou duplicar linha entre uma página
  // e outra, porque o Postgres nao garante ordem estavel sem ORDER BY.
  async function fetchAll(view, orderCols){
    const rows = DEMO_VIEWS[view] || [];
    return rows.filter(r => !STATUS_OCULTOS.includes(r.status_proposta));
  }

  // Carga "essencial" (o que a Análise Geral/Comparação mostram de cara) -
  // dmd/dmp (drill de profissional->procedimento) e duP/dmProp (metrica
  // valor_proposta pros status != Executada) ficam de fora daqui, so'
  // carregam sob demanda (ver loadProfProc/loadPropostaMetrics) - assim a
  // tela inicial nao espera dados que talvez nunca sejam abertos.
  async function loadCore(user){
    const [dia, prof, proc, pac] = await Promise.all([
      fetchAll("vw_dia", ["unidade_nome","status_proposta","dia"]),
      fetchAll("vw_prof_dia", ["unidade_nome","status_proposta","profissional_proposta","dia"]),
      fetchAll("vw_proc_dia", ["unidade_nome","status_proposta","nome_procedimento","dia"]),
      fetchAll("vw_pacote_dia", ["unidade_nome","status_proposta","nome_pacote","dia"]).catch(() => [])
    ]);
    let dRows = dia, pRows = prof, cRows = proc, kRows = pac;
    if(!user.isMaster){
      dRows = dRows.filter(r => r.unidade_nome === user.unidade);
      pRows = pRows.filter(r => r.unidade_nome === user.unidade);
      cRows = cRows.filter(r => r.unidade_nome === user.unidade);
      kRows = kRows.filter(r => r.unidade_nome === user.unidade);
    }
    const units = [...new Set(dRows.map(r => r.unidade_nome))].sort();
    const uidx = {}; units.forEach((u,i) => uidx[u] = i);
    const statuses = [...new Set(dRows.map(r => r.status_proposta || "Sem status"))].sort();
    const sidx = {}; statuses.forEach((s,i) => sidx[s] = i);
    const su = r => sidx[r.status_proposta || "Sem status"];
    const du = dRows.map(r => [uidx[r.unidade_nome], su(r), r.dia, Number(r.valor), Number(r.qtd_propostas), Number(r.qtd_itens)]);
    const dm = {}; pRows.forEach(r => { const k = r.profissional_proposta || "(sem profissional)"; (dm[k] = dm[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    const dproc = {}; cRows.forEach(r => { const k = r.nome_procedimento || "(sem procedimento)"; (dproc[k] = dproc[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    const dpac = {}; kRows.forEach(r => { const k = r.nome_pacote || "(sem pacote)"; (dpac[k] = dpac[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    const dates = du.map(r => r[2]).sort();
    const anoAtual = String(new Date().getFullYear());
    const months = [...new Set(dates.map(d => d.slice(0,7)))].filter(ym => ym.startsWith(anoAtual)).sort().map(ym => [ym, monthLbl(ym)]);
    const dmin = dates[0]||"", dmax = dates[dates.length-1]||"";
    const calMin = (dmin ? dmin.slice(0,4) : anoAtual) + "-01-01";
    const statExecutada = statuses.indexOf("Executada");
    return { units, statuses, statExecutada, du, dm, dproc, dpac, dmin, dmax, calMin, calMax: dmax, months,
      dmd: null, dmp: null, duP: null, dmProp: null };

  // Sob demanda: drill profissional -> dia -> procedimento (abas
  // Profissionais/Procedimentos - Detalhado). Precisa de units/statuses do
  // store ja carregado pra manter os mesmos indices (uidx/sidx).
  async function loadProfProc(user, store){
    let ppRows = await fetchAll("vw_prof_proc", ["unidade_nome","status_proposta","profissional_proposta","dia","nome_procedimento"]).catch(() => []);
    if(!user.isMaster) ppRows = ppRows.filter(r => r.unidade_nome === user.unidade);
    const uidx = {}; store.units.forEach((u,i) => uidx[u] = i);
    const sidx = {}; store.statuses.forEach((s,i) => sidx[s] = i);
    const su = r => sidx[r.status_proposta || "Sem status"];
    const dmd = {}; ppRows.forEach(r => { const k = r.profissional_proposta+"||"+r.dia; (dmd[k] = dmd[k]||[]).push({ proc: r.nome_procedimento, valor: Number(r.valor), un: uidx[r.unidade_nome], st: su(r), qtd: Number(r.qtd||0) }); });
    const dmp = {}; ppRows.forEach(r => { const nom = r.profissional_proposta; if(!dmp[nom]) dmp[nom] = {}; const p = r.nome_procedimento; dmp[nom][p] = (dmp[nom][p]||0) + Number(r.valor); });
    return { dmd, dmp };
  }

  // Sob demanda: metrica valor_proposta (dia + por profissional), so'
  // usada quando o Status selecionado != Executada.
  async function loadPropostaMetrics(user, store){
    const [diaProp, profProp] = await Promise.all([
      fetchAll("vw_dia_proposta", ["unidade_nome","status_proposta","dia"]).catch(() => []),
      fetchAll("vw_prof_dia_proposta", ["unidade_nome","status_proposta","profissional_proposta","dia"]).catch(() => [])
    ]);
    let dpRows = diaProp, ppfRows = profProp;
    if(!user.isMaster){
      dpRows = dpRows.filter(r => r.unidade_nome === user.unidade);
      ppfRows = ppfRows.filter(r => r.unidade_nome === user.unidade);
    }
    const uidx = {}; store.units.forEach((u,i) => uidx[u] = i);
    const sidx = {}; store.statuses.forEach((s,i) => sidx[s] = i);
    const su = r => sidx[r.status_proposta || "Sem status"];
    const duP = dpRows.map(r => [uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]);
    const dmProp = {}; ppfRows.forEach(r => { const k = r.profissional_proposta || "(sem profissional)"; (dmProp[k] = dmProp[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });

  // stat: indice do UNICO status selecionado (nao soma mais de um -
  // valor_proposta e valor_final_item nao podem ser combinados).
  function buildPred(unis, stat, pmode, months, de, ate){
    return (u, s, d) => {
      if(unis.length > 0 && !unis.includes(u)) return false;
      if(s !== stat) return false;
      if(pmode === "mes") return months.includes(d.slice(0,7));
      return d >= de && d <= ate;
    };
  }

          ${filtered.map(([v,lbl2]) => html`<label key=${v} style=${{display:"flex",alignItems:"center",gap:"8px",padding:"6px 14px",cursor:"pointer",fontSize:"12.5px",color:"#2b2a28"}}>

  function aggDaily(store, pred){
    const m = {}, qp = {}, qi = {};
    store.du.forEach(([u,s,d,vf,qtdp,qtdi]) => { if(pred(u,s,d)){ m[d]=(m[d]||0)+vf; qp[d]=(qp[d]||0)+qtdp; qi[d]=(qi[d]||0)+qtdi; } });
    return Object.keys(m).sort().reverse().map(d => [d, m[d], qp[d], qi[d]]);
  }
  function aggEntity(data, pred){
    return Object.entries(data).map(([name, arr]) => {
      const days = {};
      arr.forEach(([u,s,d,vf]) => { if(pred(u,s,d)) days[d]=(days[d]||0)+vf; });
      const dl = Object.keys(days).sort().reverse().map(d => [d, days[d]]);
      return { name, days: dl, total: dl.reduce((s,r) => s+r[1], 0) };
    }).filter(e => e.days.length > 0).sort((a,b) => b.total - a.total);
  }

  // ===== Aba Comparação: meses fechados (2025-2026, exclui o mes corrente) =====
  function closedMonthsFrom(store){
    const today = new Date();
    const anoMesAtual = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
    const all = [...new Set(store.du.map(r => r[2].slice(0,7)))]
      .filter(ym => ym >= "2025-01" && ym <= "2026-12" && ym < anoMesAtual)
      .sort();
    return all.map(ym => [ym, monthLbl(ym)]);
  }
  // meses: array de "YYYY-MM" - permite comparar grupos com mais de um mes
  // (ex.: mes anterior = [jan/25,fev/25] x mes posterior = [jan/26,fev/26]).
  function predGrupo(store, unis, meses){
    return (u,s,d) => (unis.length===0||unis.includes(u)) && s===store.statExecutada && meses.includes(d.slice(0,7));
  }
  function kpiGrupo(store, unis, meses){
    const pred = predGrupo(store, unis, meses);
    let vf=0, qtd=0;
    store.du.forEach(([u,s,d,valor,qtdp]) => { if(pred(u,s,d)){ vf+=valor; qtd+=qtdp; } });
    let dias = 0;
    meses.forEach(ym => { const [y,m] = ym.split("-").map(Number); dias += new Date(y, m, 0).getDate(); });
    return { vf, qtd, ticket: qtd?vf/qtd:0, media: dias?vf/dias:0, dias };
  }
  const groupLabel = meses => meses.map(monthLbl).join(" + ");

  // valueType "brl" (padrao, valores em dinheiro) ou "count" (quantidade,
  // sem "R$" - ex.: Propostas por status)
  function Chartjs({ labels, data, horizontal, height, valueType }){
    const ref = React.useRef(null), inst = React.useRef(null);
    const sig = labels.join("|") + "#" + data.map(n => Math.round(n)).join(",");
    const fmtTip = valueType === "count" ? (v => v.toLocaleString("pt-BR")) : brl;
    useEffect(() => {
      if(!ref.current || !window.Chart) return;
      if(inst.current){ inst.current.destroy(); inst.current = null; }
      inst.current = new Chart(ref.current, {
        type: "bar",
        data: { labels, datasets: [{ data, backgroundColor: AC, hoverBackgroundColor: "#cf7400", borderRadius: 4, maxBarThickness: horizontal ? 16 : 30 }] },
        options: {
          indexAxis: horizontal ? "y" : "x",
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 350 },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtTip(Number(c.raw)) } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: "#a59c8d", maxRotation: 0, autoSkip: true, maxTicksLimit: horizontal ? 6 : 16 } },
            y: { grid: { color: "#f3eee6" }, ticks: { font: { size: 10 }, color: "#a59c8d", autoSkip: !horizontal ? false : true } }
          }
        }
      });
      return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
    }, [sig, horizontal]);
    return html`<div class="chartbox" style=${{ height: (height||230)+"px" }}><canvas ref=${ref}></canvas></div>`;
  }

  // Grafico combinado (mes anterior x mes posterior) - dia do mes no eixo X.
  // Mes anterior = coluna (barra), mes posterior = linha, conforme pedido.
  // Componente separado do Chartjs (que so faz barra simples) pra nao
  // arriscar quebrar os graficos existentes.
  function ComboChartjs({ labels, dataBar, dataLine, labelBar, labelLine, height }){
    const ref = React.useRef(null), inst = React.useRef(null);
    const sig = labels.join(",") + "#" + dataBar.map(n=>Math.round(n||0)).join(",") + "#" + dataLine.map(n=>Math.round(n||0)).join(",");
    useEffect(() => {
      if(!ref.current || !window.Chart) return;
      if(inst.current){ inst.current.destroy(); inst.current = null; }
      inst.current = new Chart(ref.current, {
        type: "bar",
        data: { labels, datasets: [
          { type: "bar", label: labelBar, data: dataBar, backgroundColor: "#b8ad9c", hoverBackgroundColor: "#a59c8d", borderRadius: 4, maxBarThickness: 22, order: 2 },
          { type: "line", label: labelLine, data: dataLine, borderColor: AC, backgroundColor: AC, pointRadius: 2, tension: .25, order: 1 }
        ] },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 350 },
          plugins: { legend: { display: true, position: "top", labels: { boxWidth: 12, font: { size: 11 }, color: "#6e675c" } }, tooltip: { callbacks: { label: c => c.dataset.label+": "+brl(Number(c.raw)) } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: "#a59c8d", maxRotation: 0, autoSkip: true, maxTicksLimit: 16 } },
            y: { grid: { color: "#f3eee6" }, ticks: { font: { size: 10 }, color: "#a59c8d" } }
          }
        }
      });
      return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
    }, [sig]);
    return html`<div class="chartbox" style=${{ height: (height||260)+"px" }}><canvas ref=${ref}></canvas></div>`;
  }

  function aggDailyProposta(store, pred){

  // Propostas por status - ignora o filtro de status (mostra todos ao mesmo tempo),
  // respeita Unidade/Período. Fonte: store.du (qtd_propostas ja vem 1x por proposta).
  function propostasPorStatus(store, unis, pmode, months, de, ate){
    const okUD = (u,d) => (unis.length===0||unis.includes(u)) && (pmode==="mes" ? months.includes(d.slice(0,7)) : (d>=de&&d<=ate));
    const qtd = {};

    return store.statuses.map((name,i) => ({ name, qtd: qtd[i]||0 })).filter(x=>x.qtd>0).sort((a,b)=>b.qtd-a.qtd);

  // Rótulo da taxa que acompanha o status selecionado no filtro (uma única
  // KPI que se reforma de acordo com o Status escolhido).
  const TAXA_LABEL_POR_STATUS = {

    "Rejeitada": "Taxa de Rejeição",

  function taxaDoStatus(porStatus, statusAtual){
    const total = porStatus.reduce((s,x) => s+x.qtd, 0) || 1;
    const qtd = porStatus.find(x => x.name === statusAtual)?.qtd || 0;

  // Tabela de comparação de KPIs entre dois meses, com variação % (seta+cor).
  function KpiCompareTable({ mes1Label, mes2Label, k1, k2 }){
    const linha = (label, v1, v2, fmt) => {
      let variacao = null;
      if(v1 !== 0) variacao = (v2 - v1) / v1 * 100;
      else if(v2 !== 0) variacao = 100;
      const up = variacao !== null && variacao >= 0;
      return html`<tr key=${label}>
        <td>${label}</td>
        <td class="num">${fmt(v1)}</td>
        <td class="num">${fmt(v2)}</td>
        <td class="num" style=${{color: variacao===null?"#a59c8d":(up?"#2e7d32":"#b3261e"),fontWeight:600}}>
          ${variacao===null ? "—" : html`<i class=${"ti "+(up?"ti-trending-up":"ti-trending-down")}></i> ${(up?"+":"")}${variacao.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})}%`}
        </td>
      </tr>`;
    };
    return html`<div class="visual">
      <div class="visual-h"><i class="ti ti-arrows-diff"></i>Comparação de KPIs</div>
      <table>
        <thead><tr><th>Indicador</th><th class="num">${mes1Label}</th><th class="num">${mes2Label}</th><th class="num">Variação</th></tr></thead>

          ${linha("Valor Final", k1.vf, k2.vf, brl0)}
          ${linha("Ticket Médio", k1.ticket, k2.ticket, brl0)}

        </tbody>
      </table>
    </div>`;

  // Aba "Comparação" - solta, filtro proprio (Unidade + 2 meses fechados),
  // sempre status Executada. Reaproveita Matrix/store, sem novas buscas.
  function Comparacao({ store }){
    const closedMonths = closedMonthsFrom(store);
    const [unis, setUnis] = useState([]);
    const [mesAnt, setMesAnt] = useState(closedMonths.length>1 ? [closedMonths[closedMonths.length-2][0]] : (closedMonths[0] ? [closedMonths[0][0]] : []));
    const [mesPos, setMesPos] = useState(closedMonths.length>0 ? [closedMonths[closedMonths.length-1][0]] : []);
    const uniOpts = store.units.map((u,i) => [i, u]);
    if(closedMonths.length === 0) return html`<div class="visual"><div class="visual-h">Comparação</div><div style=${{padding:"20px 16px",color:"#8a8378"}}>Não há meses fechados suficientes (2025-2026) para comparar ainda.</div></div>`;

      <div class="fld"><span>Mês anterior</span><${MultiSelect} options=${closedMonths} value=${mesAnt} onChange=${setMesAnt} placeholder="Selecione o(s) mês(es)" /></div>
      <div class="fld"><span>Mês posterior</span><${MultiSelect} options=${closedMonths} value=${mesPos} onChange=${setMesPos} placeholder="Selecione o(s) mês(es)" /></div>
    </div>`;
    if(mesAnt.length === 0 || mesPos.length === 0){
      return html`<${React.Fragment}>${filterBar}<div class="canvas"><div class="visual"><div style=${{padding:"20px 16px",color:"#8a8378"}}>Selecione ao menos um mês em "Mês anterior" e em "Mês posterior" pra comparar.</div></div></div></>`;
    }
    if(mesAnt.length !== mesPos.length){
      return html`<${React.Fragment}>${filterBar}<div class="canvas"><div class="visual"><div style=${{padding:"20px 16px",color:"#b3261e"}}>Selecione a mesma quantidade de meses em "Mês anterior" (${mesAnt.length}) e "Mês posterior" (${mesPos.length}) pra comparar.</div></div></div></>`;
    }
    const antLabel = groupLabel(mesAnt), posLabel = groupLabel(mesPos);
    const k1 = kpiGrupo(store, unis, mesAnt), k2 = kpiGrupo(store, unis, mesPos);
    const pred1 = predGrupo(store, unis, mesAnt), pred2 = predGrupo(store, unis, mesPos);
    const nDias = Math.max(...[...mesAnt, ...mesPos].map(ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }));
    const baseOk = (u,s) => (unis.length===0||unis.includes(u)) && s===store.statExecutada;
    const porDia = {};
    store.du.forEach(([u,s,d,valor]) => { if(baseOk(u,s)) porDia[d] = (porDia[d]||0)+valor; });
    const sumGrupoPorDia = meses => Array.from({length:nDias}, (_,i) => {
      const dia = String(i+1).padStart(2,"0");
      return meses.reduce((s,ym) => s + (porDia[ym+"-"+dia]||0), 0);
    });
    const dataAnt = sumGrupoPorDia(mesAnt), dataPos = sumGrupoPorDia(mesPos);
    const labels = Array.from({length:nDias}, (_,i) => String(i+1).padStart(2,"0"));
    const prof1 = aggEntity(store.dm, pred1), prof2 = aggEntity(store.dm, pred2);
    const proc1 = aggEntity(store.dproc, pred1), proc2 = aggEntity(store.dproc, pred2);
    const pac1 = aggEntity(store.dpac||{}, pred1), pac2 = aggEntity(store.dpac||{}, pred2);
    return html`<${React.Fragment}>
      ${filterBar}
      <div class="canvas">
        <${KpiCompareTable} mes1Label=${antLabel} mes2Label=${posLabel} k1=${k1} k2=${k2} />

          <div class="visual-h"><i class="ti ti-chart-line"></i>Valor por dia — ${antLabel} x ${posLabel}</div>

          <${Matrix} title=${"Por profissional — "+antLabel} icon="ti-user" entities=${prof1} nameHead="Profissional" />
          <${Matrix} title=${"Por profissional — "+posLabel} icon="ti-user" entities=${prof2} nameHead="Profissional" />
        </div>
        <div class="grid2">
          <${Matrix} title=${"Por procedimento — "+antLabel} icon="ti-clipboard-list" entities=${proc1} nameHead="Procedimento" />
          <${Matrix} title=${"Por procedimento — "+posLabel} icon="ti-clipboard-list" entities=${proc2} nameHead="Procedimento" />
        </div>
        <div class="grid2">
          <${Matrix} title=${"Por pacote — "+antLabel} icon="ti-package" entities=${pac1} nameHead="Pacote" />
          <${Matrix} title=${"Por pacote — "+posLabel} icon="ti-package" entities=${pac2} nameHead="Pacote" />
        </div>
      </div>
    </>`;
  }

    { v:"1.4", tag:"Geral", ico:"ti-calendar", txt:"O painel abre direto mostrando o mês atual, em vez do ano inteiro. Menos rolagem, foco no que é mais recente." },
    { v:"1.3", tag:"Comparação", ico:"ti-chart-line", txt:"Nova aba \"Comparação\": escolha dois meses (ou grupos de meses) e veja lado a lado os KPIs, o gráfico e os rankings de profissional/procedimento/pacote, com a variação percentual entre eles." },
    { v:"1.2", tag:"Status", ico:"ti-list-check", txt:"Novo gráfico mostrando quantas propostas existem em cada status (Executada, Aguardando aprovação, Aprovada, Rejeitada)." },
    { v:"1.1", tag:"Status", ico:"ti-filter", txt:"Filtro de Status no topo, pra escolher um status por vez. Quando não for \"Executada\", os valores passam a refletir o valor da proposta inteira (sem contar duas vezes), e a tabela de Pacotes fica escondida (não se aplica a esses status)." },
    { v:"1.0", tag:"Geral", ico:"ti-layout-dashboard", txt:"Painel criado: Análise Geral, Profissionais/Procedimentos/Pacotes - Detalhado, com dados sincronizados automaticamente todos os dias." },
  ];
  function PatchNotes({ onClose }){
    return html`<div onClick=${onClose} style=${{position:"fixed",inset:0,background:"rgba(20,18,16,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",backdropFilter:"blur(2px)"}}>
      <div onClick=${e => e.stopPropagation()} style=${{background:"#fff",borderRadius:"14px",boxShadow:"0 24px 64px rgba(0,0,0,.18)",width:"100%",maxWidth:"480px",maxHeight:"84vh",display:"flex",flexDirection:"column",overflow:"hidden",border:"1px solid #e3ded7"}}>
        <div style=${{padding:"18px 20px",borderBottom:"1px solid #eee6da",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"12px",flexShrink:0}}>
          <div style=${{display:"flex",alignItems:"center",gap:"12px"}}>
            <div style=${{width:"42px",height:"42px",borderRadius:"10px",background:"#fdf1e3",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"1px solid #eee6da"}}><i class="ti ti-robot" style=${{fontSize:"20px",color:AC}}></i></div>
            <div>
              <div style=${{fontSize:"14.5px",fontWeight:600,color:"#2b2a28",letterSpacing:"-.01em"}}>Registro de Atualizações</div>
              <div style=${{fontSize:"11.5px",color:"#a59c8d",marginTop:"2px"}}>Aqui estão todas as melhorias do painel</div>
            </div>
          </div>
          <button onClick=${onClose} style=${{background:"none",border:"1px solid #e3ded7",cursor:"pointer",color:"#8a8378",fontSize:"18px",width:"30px",height:"30px",borderRadius:"8px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,lineHeight:1,fontWeight:300,fontFamily:"sans-serif"}}>×</button>
        </div>
        <div style=${{overflowY:"auto",flex:1}}>
          ${NOTAS.map((n,i) => html`<div key=${i} style=${{padding:"14px 20px",borderBottom:"1px solid #f5f1ea",display:"flex",gap:"12px",alignItems:"flex-start"}}>
            <div style=${{width:"32px",height:"32px",borderRadius:"8px",background:"#fdf1e3",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:"1px",border:"1px solid #eee6da"}}><i class="ti ti-robot" style=${{fontSize:"16px",color:AC}}></i></div>
            <div style=${{flex:1,minWidth:0}}>
              <div style=${{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"}}>
                <code style=${{fontSize:"10.5px",fontWeight:700,color:"#E8830F",background:"#fdf1e3",padding:"2px 7px",borderRadius:"5px",fontFamily:"monospace",letterSpacing:".02em"}}>v${n.v}</code>
                <span style=${{fontSize:"10.5px",fontWeight:600,color:"#a59c8d",textTransform:"uppercase",letterSpacing:".06em"}}>${n.tag}</span>
              </div>
              <div style=${{fontSize:"13px",color:"#4a443c",lineHeight:"1.6"}}>${n.txt}</div>
            </div>
          </div>`)}
        </div>
        <div style=${{padding:"11px 20px",borderTop:"1px solid #eee6da",flexShrink:0,background:"#fcfbf9",display:"flex",alignItems:"center",justifyContent:"center",gap:"7px"}}>
          <i class="ti ti-sun" style=${{fontSize:"14px",color:"#E8830F"}}></i>
          <span style=${{fontSize:"12px",color:"#8a8378"}}>Dados atualizados automaticamente todos os dias às 8h</span>
        </div>
      </div>
    </div>`;
  }
  function Dashboard({ user, store, ensureProfProc, ensurePropostaMetrics, onLogout }){
    const [page, setPage] = useState("geral");
    const [showNotes, setShowNotes] = useState(false);
    const [unis, setUnis] = useState([]);
    const [stat, setStat] = useState(store.statExecutada >= 0 ? store.statExecutada : 0);
    const [fProfs, setFProfs] = useState([]);
    const [fProcs, setFProcs] = useState([]);
    const [pmode, setPmode] = useState("mes");
    const [months, setMonths] = useState(() => {
      const today = new Date();
      const ymAtual = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
      return store.months.some(m => m[0]===ymAtual) ? [ymAtual] : store.months.map(m => m[0]);
    });
    const [de, setDe] = useState(store.dmin);
    const [ate, setAte] = useState(store.dmax);
    const [kpi, setKpi] = useState(null);
    const statusAtual = store.statuses[stat];
    const isExecutada = statusAtual === "Executada";
    // Dados sob demanda: so' busca quando realmente preciso (aba de
    // drill-down aberta, ou status != Executada selecionado).
    useEffect(() => { if(page==="prof" || page==="proc") ensureProfProc(); }, [page]);
    useEffect(() => { if(!isExecutada) ensurePropostaMetrics(); }, [isExecutada]);
    const propMetricsLoading = !isExecutada && store.duP === null;
    const profProcLoading = (page==="prof" || page==="proc") && store.dmd === null;
    const pred = buildPred(unis, stat, pmode, months, de, ate);
    const dailyItem = aggDaily(store, pred);
    const daily = isExecutada ? dailyItem : (() => {
      const propMap = aggDailyProposta({ duP: store.duP||[] }, pred);
      return dailyItem.map(([d,vf,qp,qi]) => [d, propMap[d]||0, qp, qi]);
    })();
    const prof = aggEntity(isExecutada ? store.dm : (store.dmProp||{}), pred);
    const proc = aggEntity(store.dproc, pred);
    const procSemValor = proc;
    const pac = aggEntity(store.dpac || {}, pred);
    const statusChart = propostasPorStatus(store, unis, pmode, months, de, ate);
    const profOpts = [...new Set(Object.keys(store.dmd||{}).map(k => k.split("||")[0]))].sort().map(m => [m, m]);
    const procOpts = Object.keys(store.dproc||{}).sort().map(p => [p, p]);
    const periodOk = d => pmode === "mes" ? months.includes(d.slice(0,7)) : (d >= de && d <= ate);
    useEffect(() => {
      let cancel = false; setKpi(null);
      const dias = periodDays(pmode, months, de, ate, store.calMin, store.calMax);
      const p_unidade = user.isMaster ? (unis.length === 1 ? store.units[unis[0]] : null) : user.unidade;
      const p_status = store.statuses[stat];
      const diasSet = new Set(dias);
      const kpiRows = DEMO_EVENTS.filter(r => (!p_unidade || r.unidade === p_unidade) && r.status === p_status && diasSet.has(r.dia));
      setTimeout(() => {
        if(cancel) return;
        const vf = kpiRows.reduce((a,r) => a + r.valor, 0);
        setKpi({ vf, qtd: kpiRows.length, itens: kpiRows.length, dias: dias.length });
      }, 120);
      return () => { cancel = true; };
    }, [unis.join(","), stat, pmode, months.join(","), de, ate]);
    const dchart = daily.slice().reverse();
    const ini = (user.isMaster ? "D" : (user.unidade||"U")).replace("Unidade ","").charAt(0).toUpperCase();
    return html`<div>
      ${showNotes ? html`<${PatchNotes} onClose=${() => setShowNotes(false)} />` : null}
      <div class="hdr">
        <div class="hdr-l"><img class="logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23E8830F'/%3E%3Ctext x='32' y='41' font-size='26' font-family='Segoe UI, sans-serif' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" alt="Painel demo" /><b>Painel de Propostas</b></div>
        <div class="hdr-r"><button class=${"lo"+(showNotes?"":" lo-pulse")} onClick=${() => setShowNotes(true)} aria-label="Novidades" title="Ver novidades"><span class="inbox-ico"></span></button><span class="chip"><span class="av">${ini}</span>${user.isMaster ? "diretoria" : user.login}</span><button class="lo" onClick=${onLogout} aria-label="Sair"><i class="ti ti-logout"></i></button></div>
      </div>
      <div class="body">
        <div class="side">
          <div class="side-t">Páginas</div>
          <div class=${"nav"+(page==="geral"?" active":"")} onClick=${() => setPage("geral")}><i class="ti ti-layout-dashboard"></i>Análise Geral</div>
          <div class=${"nav"+(page==="prof"?" active":"")} onClick=${() => setPage("prof")}><i class="ti ti-user"></i>Profissionais - Detalhado</div>
          <div class=${"nav"+(page==="proc"?" active":"")} onClick=${() => setPage("proc")}><i class="ti ti-clipboard-list"></i>Procedimentos - Detalhado</div>
          <div class=${"nav"+(page==="pac"?" active":"")} onClick=${() => setPage("pac")}><i class="ti ti-package"></i>Pacotes - Detalhado</div>
          <div class=${"nav"+(page==="comp"?" active":"")} onClick=${() => setPage("comp")}><i class="ti ti-chart-line"></i>Comparação</div>
        </div>
        <div class="main">
          ${page==="comp" ? html`<${Comparacao} store=${store} />` : html`<${React.Fragment}>
          <${FilterBar} store=${store} user=${user} unis=${unis} setUnis=${setUnis} stat=${stat} setStat=${setStat} pmode=${pmode} setPmode=${setPmode} months=${months} setMonths=${setMonths} de=${de} setDe=${setDe} ate=${ate} setAte=${setAte} page=${page} fProfs=${fProfs} setFProfs=${setFProfs} profOpts=${profOpts} fProcs=${fProcs} setFProcs=${setFProcs} procOpts=${procOpts} />
          <div class="canvas">
        ${page==="geral" ? html`<${React.Fragment}>
          ${propMetricsLoading ? html`<div class="visual" style=${{padding:"10px 16px",color:"#8a8378",fontSize:"12.5px"}}><i class="ti ti-loader"></i> Carregando dados desse status pela primeira vez…</div>` : null}
          <${Kpis} kpi=${kpi} taxa=${taxaDoStatus(statusChart, statusAtual)} />
          <div class="visual">
            <div class="visual-h"><i class="ti ti-chart-bar"></i>Valor por dia (Propostas)</div>
            <${Chartjs} labels=${dchart.map(r=>ddmm(r[0]))} data=${dchart.map(r=>r[1])} height=${230} />
          </div>
          <div class="visual">
            <div class="visual-h"><i class="ti ti-list-check"></i>Propostas por status <small>· quantidade de propostas</small></div>
            <${Chartjs} horizontal=${true} valueType="count" labels=${statusChart.map(s=>s.name)} data=${statusChart.map(s=>s.qtd)} height=${Math.max(120, statusChart.length*40)} />
          </div>
          <div class="grid2">
            <${Matrix} title="Por profissional (solicitante)" icon="ti-user" entities=${prof} nameHead="Profissional" />
            ${isExecutada ? html`<${Matrix} title="Por procedimento" icon="ti-clipboard-list" entities=${proc} nameHead="Procedimento" />` : html`<${ProcCanceladoList} entities=${procSemValor} />`}
          </div>
          ${isExecutada ? html`<${Matrix} title="Por pacote" icon="ti-package" entities=${pac} nameHead="Pacote" />` : null}
          <${TotalTable} daily=${daily} />
        </>` : null}
        ${page==="prof" ? (profProcLoading ? html`<div class="visual"><div style=${{padding:"30px 16px",color:"#8a8378"}}><i class="ti ti-loader"></i> Carregando detalhes de profissionais…</div></div>` : html`<${ProfissionaisDetailPage} entities=${prof} dmd=${store.dmd} dmp=${store.dmp} unis=${unis} stat=${stat} fProcs=${fProcs} periodOk=${periodOk} />`) : null}
        ${page==="proc" ? (profProcLoading ? html`<div class="visual"><div style=${{padding:"30px 16px",color:"#8a8378"}}><i class="ti ti-loader"></i> Carregando detalhes de procedimentos…</div></div>` : html`<${ProcedimentosDetailPage} entities=${proc} dmd=${store.dmd} pred=${pred} fProfs=${fProfs} topProfs=${prof} />`) : null}
        ${page==="pac" ? html`<${PacotesDetailPage} user=${user} store=${store} unis=${unis} pmode=${pmode} months=${months} de=${de} ate=${ate} />` : null}
          </div>
        </>`}
        </div>
      </div>
    </div>`;
  }
  function Login({ onLogin, err, busy }){
    const [u, setU] = useState(""); const [p, setP] = useState("");
    const go = () => { if(!busy && u.trim() && p) onLogin(u, p); };
    return html`<div class="gate"><div class="gate-card">
      <img class="logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23E8830F'/%3E%3Ctext x='32' y='41' font-size='26' font-family='Segoe UI, sans-serif' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" alt="Painel demo" />
      <p class="gate-sub">Painel de Propostas</p>
      <label>Login</label>
      <input type="text" value=${u} onChange=${e => setU(e.target.value)} onKeyDown=${e => e.key==="Enter" && go()} placeholder="ex.: morumbi" />
      <label>Senha</label>
      <input type="password" value=${p} onChange=${e => setP(e.target.value)} onKeyDown=${e => e.key==="Enter" && go()} placeholder="••••••" />
      <button class="btn" onClick=${go} disabled=${busy}>${busy ? "Entrando..." : "Entrar"}</button>
      <div class="err">${err}</div>
      <div class="hint">Ambiente de demonstração — qualquer login e senha funcionam</div>
    </div></div>`;
  }
  function App(){
    // Ambiente de previa: sem tela de login - entra direto no dashboard
    // com os dados ficticios ja carregados.
    const [user, setUser] = useState(null);
    const [store, setStore] = useState(null);
    const inFlight = React.useRef({});
    useEffect(() => {
      const u = { login: "demo", unidade: DEMO_UNIDADES[0], isMaster: true };
      loadCore(u).then(s => { setUser(u); setStore(s); });
    }, []);
    function logout(){ location.reload(); }
    const ensureProfProc = () => {
      if(!store || store.dmd !== null || inFlight.current.profProc) return;
      inFlight.current.profProc = true;
      loadProfProc(user, store).then(extra => {
        inFlight.current.profProc = false;
        setStore(s => ({ ...s, ...extra }));
      });
    };
    const ensurePropostaMetrics = () => {
      if(!store || store.duP !== null || inFlight.current.propMetrics) return;
      inFlight.current.propMetrics = true;
      loadPropostaMetrics(user, store).then(extra => {
        inFlight.current.propMetrics = false;
        setStore(s => ({ ...s, ...extra }));
      });
    };
    if(user && store) return html`<${Dashboard} user=${user} store=${store} ensureProfProc=${ensureProfProc} ensurePropostaMetrics=${ensurePropostaMetrics} onLogout=${logout} />`;
    return html`<div style=${{padding:"40px",textAlign:"center",color:"#8a8378"}}>Carregando…</div>`;
  }
  ReactDOM.createRoot(document.getElementById("pbx-root")).render(html`<${App} />`);
</script>
</body>
</html>
