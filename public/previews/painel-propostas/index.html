<style>
  body { margin: 0; background: #ece9e4; padding: 18px; }
  .pbx { --ac:#E8830F; --ac-d:#cf7400; --ac-soft:rgba(232,131,15,.14); --ac-tint:#fdf1e3; --ac-text:#9a5a06;
         font-family: "Segoe UI", system-ui, sans-serif; color: #2b2a28; background: #f4f2ef; border: 1px solid #e3ded7; border-radius: 14px; overflow: hidden; max-width: 1520px; margin: 0 auto; box-shadow: 0 10px 30px rgba(80,50,10,.08); }
  .pbx * { box-sizing: border-box; }
  .pbx .gate { min-height: 520px; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 120% at 50% 0%, #fff 0%, #faf8f5 60%, #f3f0eb 100%); padding: 24px; }
  .pbx .gate-card { width: 340px; background: #fff; border: 1px solid #e8e0d6; border-radius: 16px; padding: 32px 28px; box-shadow: 0 12px 34px rgba(54,42,28,.12); text-align: center; }
  /* Enquanto a tela de LOGIN esta visivel, o container .pbx perde a
     aparencia de "caixa" (fundo/borda/sombra/max-width) e o gate ocupa a
     tela inteira - mesmo layout do painel comercial, onde o login fica
     fora do card do app. A classe e' colocada/removida no <body> pelo
     componente Login (useEffect), entao so' vale enquanto ele esta na tela. */
  body.login-mode { padding: 0; }
  body.login-mode .pbx { background: none; border: 0; border-radius: 0; box-shadow: none; max-width: none; }
  body.login-mode .pbx .gate { min-height: 100vh; }
  .pbx .gate-card img.logo { width: 170px; height: auto; margin: 0 auto 6px; display: block; }
  .pbx .gate-sub { color: #8a8378; font-size: 12.5px; margin: 0 0 18px; }
  .pbx label { display: block; font-size: 12px; color: #8a8378; margin: 12px 0 5px; text-align: left; }
  .pbx input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d9d2c7; border-radius: 9px; font-size: 14px; background: #fff; color: #2b2a28; transition: border-color .15s, box-shadow .15s; }

    .pbx .hdr-l b { font-size: 12.5px; white-space: normal; }

<div class="pbx" id="pbx-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<!-- MODO DEMO: supabase-js (CDN) removido; cliente falso e dados ficticios neste script -->
<script>
// MODO DEMO ================================================================
// Preview publico do portfolio. Este bloco substitui o supabase-js (CDN) por
// um cliente FALSO, em memoria: nenhuma chamada de rede acontece e todos os
// dados sao ficticios, gerados aqui no navegador. A semente e' fixa por
// dia/unidade/profissional (o mesmo dia sempre gera os mesmos numeros) e a
// janela acompanha a data de hoje, para o painel nunca abrir vazio.
// O restante da pagina e' o codigo de producao; as unicas alteracoes estao
// marcadas com "MODO DEMO".
// ==========================================================================
var MODO_DEMO = (function () {
  "use strict";

  // PRNG com semente em texto (FNV-1a + mulberry32): deterministico.
  function rng(semente) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < semente.length; i++) { h ^= semente.charCodeAt(i); h = Math.imul(h, 16777619); }
    let s = h >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const pad = n => String(n).padStart(2, "0");
  const iso = dt => dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
  const partes = s => s.split("-").map(Number);
  const addDays = (s, n) => { const [y, m, d] = partes(s); return iso(new Date(y, m - 1, d + n)); };
  const addMonths = (s, n) => {
    const [y, m, d] = partes(s);
    const ultimo = new Date(y, m - 1 + n + 1, 0).getDate();
    return iso(new Date(y, m - 1 + n, Math.min(d, ultimo)));
  };
  const hoje = iso(new Date());
  // 1o dia do mes, "meses" meses antes do mes atual
  const inicioJanela = meses => { const [y, m] = partes(hoje); return iso(new Date(y, m - 1 - meses, 1)); };
  function dias(desde) { const out = []; for (let s = desde; s <= hoje; s = addDays(s, 1)) out.push(s); return out; }
  const diaDaSemana = s => { const [y, m, d] = partes(s); return new Date(y, m - 1, d).getDay(); };
  const r2 = v => Math.round(v * 100) / 100;
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function pickW(r, pares) {
    let t = 0; pares.forEach(p => { t += p[1]; });
    let x = r() * t;
    for (const p of pares) { x -= p[1]; if (x < 0) return p[0]; }
    return pares[pares.length - 1][0];
  }
  function binom(r, n, p) { let k = 0; for (let i = 0; i < n; i++) if (r() < p) k++; return k; }
  const gauss = r => Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(2 * Math.PI * r());

  // GROUP BY keys, SUM(...) - imita as views agregadas do banco.
  function agg(linhas, chaves, somas) {
    const m = new Map();
    for (const l of linhas) {
      const k = chaves.map(c => l[c]).join("\u0001");
      let o = m.get(k);
      if (!o) { o = {}; chaves.forEach(c => { o[c] = l[c]; }); somas.forEach(([c]) => { o[c] = 0; }); m.set(k, o); }
      somas.forEach(([c, fn]) => { o[c] += fn(l); });
    }
    const out = [...m.values()];
    out.forEach(o => somas.forEach(([c]) => { o[c] = r2(o[c]); }));
    return out;
  }

  // Cliente falso com a mesma API encadeavel que o painel usa:
  // from().select().eq().gte().lt().order().range() / maybeSingle() / single()
  // e auth.signInWithPassword/signOut. Respeita range() (paginacao) e order().
  function instalarSupabase(gerarViews) {
    let views = null;
    const cache = {};
    const tabela = nome => { if (!views) views = gerarViews(); return views[nome]; };

    class Consulta {
      constructor(view) { this.view = view; this.filtros = []; this.ordem = []; this.sig = view; this.ini = null; this.fim = null; this.um = null; }
      select() { return this; }
      eq(c, v) { this.filtros.push(r => r[c] === v); this.sig += "|" + c + "=" + v; return this; }
      gte(c, v) { this.filtros.push(r => r[c] != null && r[c] >= v); this.sig += "|" + c + ">=" + v; return this; }
      lt(c, v) { this.filtros.push(r => r[c] != null && r[c] < v); this.sig += "|" + c + "<" + v; return this; }
      order(c, o) { const asc = !(o && o.ascending === false); this.ordem.push([c, asc]); this.sig += "|o:" + c + (asc ? "" : ":desc"); return this; }
      range(a, b) { this.ini = a; this.fim = b; return this; }
      limit(n) { this.ini = 0; this.fim = n - 1; return this; }
      maybeSingle() { this.um = "talvez"; return this; }
      single() { this.um = "um"; return this; }
      executar() {
        const base = tabela(this.view);
        if (!base) {
          console.warn("[MODO DEMO] view sem dados ficticios:", this.view);
          return { data: null, error: { message: 'relation "' + this.view + '" does not exist (MODO DEMO)' } };
        }
        let linhas = cache[this.sig];
        if (!linhas) {
          linhas = base.filter(r => this.filtros.every(f => f(r)));
          const ordem = this.ordem;
          if (ordem.length) linhas.sort((x, y) => {
            for (const [c, asc] of ordem) {
              const a = x[c], b = y[c];
              if (a === b) continue;
              if (a == null) return 1;            // nulls last, como o PostgREST
              if (b == null) return -1;
              return (a < b ? -1 : 1) * (asc ? 1 : -1);
            }
            return 0;
          });
          cache[this.sig] = linhas;
        }
        linhas = this.ini === null ? linhas.slice() : linhas.slice(this.ini, this.fim + 1);
        if (this.um) {
          if (this.um === "um" && linhas.length !== 1) return { data: null, error: { message: "JSON object requested, multiple (or no) rows returned" } };
          return { data: linhas[0] || null, error: null };
        }
        return { data: linhas, error: null };
      }
      then(ok, falha) { return new Promise(res => setTimeout(res, 10)).then(() => this.executar()).then(ok, falha); }
    }

    const auth = {
      signInWithPassword: async ({ email }) => ({ data: { user: { id: "demo-user", email: email }, session: { access_token: "demo" } }, error: null }),
      signOut: async () => ({ error: null }),
      getSession: async () => ({ data: { session: null }, error: null }),
      getUser: async () => ({ data: { user: null }, error: null }),
      onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } })
    };
    window.supabase = { createClient: () => ({ from: v => new Consulta(v), auth: auth }) };
  }

  return { rng, pad, iso, addDays, addMonths, hoje, inicioJanela, dias, diaDaSemana, r2, pick, pickW, binom, gauss, agg, instalarSupabase };
})();
// MODO DEMO: dados ficticios do Painel de Propostas. Gera propostas com
// itens (12 meses ate hoje) e monta cada view do schema "propostas_cofre"
// com as mesmas colunas que o painel le, por agregacao dessas propostas -
// assim os numeros batem entre as abas, como no banco real.
MODO_DEMO.instalarSupabase(function () {
  const D = MODO_DEMO;
  const UNIDADES = [["Unidade Centro", 1.25], ["Unidade Jardins", 1.0], ["Unidade Paulista", 0.9], ["Unidade Norte", 0.75], ["Unidade Sul", 0.65]];
  const PROFS = {
    "Unidade Centro": ["ANA CLARA MENDES", "BRUNO FARIAS LIMA", "CAMILA ROCHA DUARTE", "DANIEL PRADO SOUZA", "FERNANDA ALVES COSTA", "MARIANA TEIXEIRA"],
    "Unidade Jardins": ["GABRIELA NUNES", "HELENA CASTRO VIANA", "IGOR MATOS RIBEIRO", "JULIANA PIRES", "ANA CLARA MENDES"],
    "Unidade Paulista": ["KARINA MOURA", "LEONARDO BARRETO", "PATRICIA LEMOS", "RENATA SOARES", "BRUNO FARIAS LIMA"],
    "Unidade Norte": ["SABRINA FONTES", "TATIANA REIS", "VANESSA QUEIROZ", "RODRIGO SALES"],
    "Unidade Sul": ["ALINE CARVALHO", "BEATRIZ MONTEIRO", "CAROLINA DIAS", "EDUARDO FREITAS"]
  };
  // [procedimento, preco de tabela, qtd minima, qtd maxima, peso]
  const PROCS = [
    ["Toxina botulínica", 1800, 1, 1, 10],
    ["Preenchimento com ácido hialurônico", 2400, 1, 2, 7],
    ["Bioestimulador de colágeno", 3200, 1, 2, 5],
    ["Laser fracionado", 1500, 1, 3, 6],
    ["Depilação a laser", 380, 4, 10, 8],
    ["Ultrassom microfocado", 4200, 1, 1, 3],
    ["Peeling químico", 380, 2, 4, 5],
    ["Limpeza de pele", 220, 1, 4, 6],
    ["Microagulhamento", 650, 2, 4, 4],
    ["Radiofrequência", 480, 3, 6, 4],
    ["Criolipólise", 1300, 1, 3, 4],
    ["Fios de PDO", 2800, 1, 1, 2],
    ["Skinbooster", 1700, 1, 2, 4],
    ["Luz pulsada", 420, 3, 6, 4]
  ];
  const PACOTES = [
    ["Pacote Rejuvenescimento", ["Toxina botulínica", "Preenchimento com ácido hialurônico", "Skinbooster"]],
    ["Pacote Verão", ["Depilação a laser", "Luz pulsada", "Limpeza de pele"]],
    ["Pacote Corpo em Forma", ["Criolipólise", "Radiofrequência"]],
    ["Programa Pele Perfeita", ["Laser fracionado", "Peeling químico", "Microagulhamento"]],
    ["Pacote Noiva", ["Limpeza de pele", "Toxina botulínica", "Skinbooster", "Peeling químico"]],
    ["Combo Facial Premium", ["Ultrassom microfocado", "Bioestimulador de colágeno", "Fios de PDO"]]
  ];
  // "Aprovada pelo cliente" existe na origem e o painel esconde (STATUS_OCULTOS).
  const STATUS = [["Executada", 55], ["Aguardando aprovação do cliente", 22], ["Rejeitada pelo cliente", 18], ["Aprovada pelo cliente", 5]];
  const PROC = {}; PROCS.forEach(p => { PROC[p[0]] = p; });
  const PESOS = PROCS.map(p => [p[0], p[4]]);

  const props = [], itens = [];
  D.dias(D.inicioJanela(12)).forEach(dia => {
    const wd = D.diaDaSemana(dia);
    if (wd === 0) return;                                   // domingo fechado
    const sazonal = 1 + 0.15 * Math.sin(Number(dia.slice(5, 7)) / 12 * 2 * Math.PI);
    UNIDADES.forEach(([u, fator]) => {
      const r = D.rng("propostas|" + u + "|" + dia);
      const n = Math.round((wd === 6 ? 2.5 : 5.5) * fator * sazonal * (0.6 + r() * 0.8));
      for (let i = 0; i < n; i++) {
        const prof = D.pick(r, PROFS[u]);
        const status = D.pickW(r, STATUS);
        const pac = r() < 0.35 ? D.pick(r, PACOTES) : null;
        const nomes = pac ? pac[1].filter(() => r() < 0.75) : [];
        if (pac && !nomes.length) nomes.push(pac[1][0]);
        if (!pac) {
          const k = 1 + Math.floor(r() * r() * 3);
          for (let j = 0; j < k; j++) { const p = D.pickW(r, PESOS); if (!nomes.includes(p)) nomes.push(p); }
        }
        const desconto = r() < 0.4 ? 0 : 0.03 + r() * 0.12;
        let tabela = 0, final = 0, qtdItens = 0;
        nomes.forEach(nome => {
          const [, preco, qmin, qmax] = PROC[nome];
          const qtd = qmin + Math.floor(r() * (qmax - qmin + 1));
          const bruto = Math.round(preco * (0.9 + r() * 0.25) / 10) * 10 * qtd;
          const valor = D.r2(bruto * (1 - desconto));
          tabela += bruto; final += valor; qtdItens += qtd;
          itens.push({ unidade_nome: u, status_proposta: status, dia, profissional_proposta: prof,
            nome_procedimento: nome, nome_pacote: pac ? pac[0] : null, valor, qtd });
        });
        props.push({ unidade_nome: u, status_proposta: status, dia, profissional_proposta: prof,
          nome_pacote: pac ? pac[0] : null, valor_itens: final, valor_proposta: tabela, qtd_itens: qtdItens });
      }
    });
  });

  const comPacote = itens.filter(x => x.nome_pacote), propsPacote = props.filter(x => x.nome_pacote);
  const valor = x => x.valor, valorItens = x => x.valor_itens, valorProposta = x => x.valor_proposta, um = () => 1;
  return {
    app_user_unidade: [{ user_id: "demo-user", unidade_nome: null, is_master: true }],
    // grao item: valor = valor_final_item
    vw_dia: D.agg(props, ["unidade_nome", "status_proposta", "dia"], [["valor", valorItens], ["qtd_propostas", um], ["qtd_itens", x => x.qtd_itens]]),
    vw_prof_dia: D.agg(props, ["unidade_nome", "status_proposta", "profissional_proposta", "dia"], [["valor", valorItens]]),
    vw_proc_dia: D.agg(itens, ["unidade_nome", "status_proposta", "nome_procedimento", "dia"], [["valor", valor], ["qtd_itens", x => x.qtd]]),
    vw_pacote_dia: D.agg(comPacote, ["unidade_nome", "status_proposta", "nome_pacote", "dia"], [["valor", valor]]),
    vw_prof_proc: D.agg(itens, ["unidade_nome", "status_proposta", "profissional_proposta", "dia", "nome_procedimento"], [["valor", valor], ["qtd", x => x.qtd]]),
    vw_pacote_solic: D.agg(comPacote, ["unidade_nome", "status_proposta", "dia", "profissional_proposta", "nome_pacote", "nome_procedimento"], [["valor", valor]]),
    // grao proposta: valor = valor_proposta (status != Executada)
    vw_dia_proposta: D.agg(props, ["unidade_nome", "status_proposta", "dia"], [["valor", valorProposta]]),
    vw_prof_dia_proposta: D.agg(props, ["unidade_nome", "status_proposta", "profissional_proposta", "dia"], [["valor", valorProposta]]),
    vw_pacote_dia_proposta: D.agg(propsPacote, ["unidade_nome", "status_proposta", "nome_pacote", "dia"], [["valor", valorProposta]])
  };
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // Backend PRÓPRIO (Postgres + PostgREST no Dokploy, schema "propostas_cofre"),
  // NÃO é o Supabase do poew-app — mesmo padrão do painel-estoque, reaproveitando
  // o Postgres/PostgREST que já existem lá, só que com schema novo.
  // MODO DEMO: URLs e chaves reais removidas. "supabase" aqui e' o cliente
  // falso definido no script anterior (dados ficticios em memoria).
  const SUPA_URL = "demo"; // MODO DEMO
  const SUPA_ANON = "demo"; // MODO DEMO
  const AC = "#E8830F";
  const sb = supabase.createClient(SUPA_URL, SUPA_ANON, { db: { schema: "propostas_cofre" } });
  // Client SEPARADO, so' pra LOGIN - reaproveita o mesmo Supabase Auth e a
  // mesma tabela app_user_unidade do poew-app (mesmas credenciais por
  // unidade + master). Os DADOS deste painel continuam vindo do "sb" acima
  // (nosso Postgres/PostgREST proprio) - os dois nunca se misturam.
  const AUTH_URL = "demo"; // MODO DEMO
  const AUTH_ANON = "demo"; // MODO DEMO
  const DOMINIO = "@clinicademo.com.br"; // MODO DEMO
  const sbAuth = supabase.createClient(AUTH_URL, AUTH_ANON);
  const { useState, useEffect } = React;
  const html = htm.bind(React.createElement);

  const brl = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const brl0 = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
  const pct = p => p.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
  const MLBL = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const fmtD = s => { const p = s.split("-").map(Number); const dt = new Date(p[0],p[1]-1,p[2]); const wd = ["dom","seg","ter","qua","qui","sex","sáb"][dt.getDay()]; return wd+" "+String(p[2]).padStart(2,"0")+"/"+String(p[1]).padStart(2,"0"); };
  const ddmm = s => s.slice(8,10)+"/"+s.slice(5,7);
  const monthLbl = ym => { const [y,m] = ym.split("-"); return MLBL[+m-1]+"/"+y.slice(2); };
  const periodDays = (pmode, months, de, ate, calMin, calMax) => {
    const out = [];
    const push = (f0, t0) => {
      let f = f0 < calMin ? calMin : f0, t = t0 > calMax ? calMax : t0;
      if(f > t) return;
      let d = new Date(f+"T00:00:00"); const end = new Date(t+"T00:00:00");
      while(d <= end){ out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")); d.setDate(d.getDate()+1); }
    };
    if(pmode === "mes"){ months.forEach(ym => { const [y,m] = ym.split("-").map(Number); const last = new Date(y, m, 0).getDate(); push(ym+"-01", ym+"-"+String(last).padStart(2,"0")); }); }
    else { push(de, ate); }
    return out;
  };

  // Status sempre vazio na origem (nunca tem proposta de verdade) - some
  // do painel inteiro (filtro, gráficos, tabelas) direto na leitura dos
  // dados, pra não precisar filtrar em cada lugar separado.
  const STATUS_OCULTOS = ["Aprovada pelo cliente"];

  // Lista fechada de unidades que o painel deve mostrar - todo o resto
  // (outras clínicas do mesmo Redshift, ou unidade nula) some do painel
  // inteiro (filtro, gráficos, tabelas), igual ao STATUS_OCULTOS acima.
  // MODO DEMO: nomes ficticios no lugar das unidades reais.
  const UNIDADES_PERMITIDAS = [
    "Unidade Centro",
    "Unidade Jardins",
    "Unidade Norte",
    "Unidade Paulista",
    "Unidade Sul",
  ];

  // Profissionais de teste/fake que nao devem aparecer em nenhuma lista
  // (ranking, filtro, drill-down) - mesmo padrao dos dois de cima.
  const PROFISSIONAIS_OCULTOS = ["PROFISSIONAL TESTE"]; // MODO DEMO: nome ficticio

  // orderCols: colunas pra ordenar de forma 100% determinística - sem isso,
  // paginar em lotes (range) pode perder ou duplicar linha entre uma página
  // e outra, porque o Postgres nao garante ordem estavel sem ORDER BY.
  async function fetchAll(view, orderCols){
    const out = []; let from = 0; const size = 1000;
    while(true){
      let q = sb.from(view).select("*");
      (orderCols||[]).forEach(c => { q = q.order(c); });
      const { data, error } = await q.range(from, from+size-1);
      if(error) throw error;
      out.push(...data);
      if(data.length < size) break;
      from += size;
    }
    return out
      .filter(r => !STATUS_OCULTOS.includes(r.status_proposta))
      .filter(r => UNIDADES_PERMITIDAS.includes(r.unidade_nome))
      .filter(r => !PROFISSIONAIS_OCULTOS.includes(r.profissional_proposta));
  }

  // Carga "essencial" (o que a Análise Geral/Comparação mostram de cara) -
  // dmd/dmp (drill de profissional->procedimento) e duP/dmProp (metrica
  // valor_proposta pros status != Executada) ficam de fora daqui, so'
  // carregam sob demanda (ver loadProfProc/loadPropostaMetrics) - assim a
  // tela inicial nao espera dados que talvez nunca sejam abertos.
  async function loadCore(user){
    const [dia, prof, proc, pac] = await Promise.all([
      fetchAll("vw_dia", ["unidade_nome","status_proposta","dia"]),
      fetchAll("vw_prof_dia", ["unidade_nome","status_proposta","profissional_proposta","dia"]),
      fetchAll("vw_proc_dia", ["unidade_nome","status_proposta","nome_procedimento","dia"]),
      fetchAll("vw_pacote_dia", ["unidade_nome","status_proposta","nome_pacote","dia"]).catch(() => [])
    ]);
    let dRows = dia, pRows = prof, cRows = proc, kRows = pac;
    if(!user.isMaster){
      dRows = dRows.filter(r => r.unidade_nome === user.unidade);
      pRows = pRows.filter(r => r.unidade_nome === user.unidade);
      cRows = cRows.filter(r => r.unidade_nome === user.unidade);
      kRows = kRows.filter(r => r.unidade_nome === user.unidade);
    }
    const units = [...new Set(dRows.map(r => r.unidade_nome))].sort();
    const uidx = {}; units.forEach((u,i) => uidx[u] = i);
    const statuses = [...new Set(dRows.map(r => r.status_proposta || "Sem status"))].sort();
    const sidx = {}; statuses.forEach((s,i) => sidx[s] = i);
    const su = r => sidx[r.status_proposta || "Sem status"];
    const du = dRows.map(r => [uidx[r.unidade_nome], su(r), r.dia, Number(r.valor), Number(r.qtd_propostas), Number(r.qtd_itens)]);
    const dm = {}; pRows.forEach(r => { const k = r.profissional_proposta || "(sem profissional)"; (dm[k] = dm[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    const dproc = {}; cRows.forEach(r => { const k = r.nome_procedimento || "(sem procedimento)"; (dproc[k] = dproc[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor), Number(r.qtd_itens||0)]); });
    const dpac = {}; kRows.forEach(r => { const k = r.nome_pacote || "(sem pacote)"; (dpac[k] = dpac[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    const dates = du.map(r => r[2]).sort();
    const anoAtual = String(new Date().getFullYear());
    const months = [...new Set(dates.map(d => d.slice(0,7)))].filter(ym => ym.startsWith(anoAtual)).sort().map(ym => [ym, monthLbl(ym)]);
    const dmin = dates[0]||"", dmax = dates[dates.length-1]||"";
    const calMin = (dmin ? dmin.slice(0,4) : anoAtual) + "-01-01";
    const statExecutada = statuses.indexOf("Executada");
    return { units, statuses, statExecutada, du, dm, dproc, dpac, dmin, dmax, calMin, calMax: dmax, months,
      dmd: null, dmp: null, duP: null, dmProp: null, dmPacProp: null };
  }

  // Sob demanda: drill profissional -> dia -> procedimento (abas
  // Profissionais/Procedimentos - Detalhado). Precisa de units/statuses do
  // store ja carregado pra manter os mesmos indices (uidx/sidx).
  async function loadProfProc(user, store){
    let ppRows = await fetchAll("vw_prof_proc", ["unidade_nome","status_proposta","profissional_proposta","dia","nome_procedimento"]).catch(() => []);
    if(!user.isMaster) ppRows = ppRows.filter(r => r.unidade_nome === user.unidade);
    const uidx = {}; store.units.forEach((u,i) => uidx[u] = i);
    const sidx = {}; store.statuses.forEach((s,i) => sidx[s] = i);
    const su = r => sidx[r.status_proposta || "Sem status"];
    const dmd = {}; ppRows.forEach(r => { const k = r.profissional_proposta+"||"+r.dia; (dmd[k] = dmd[k]||[]).push({ proc: r.nome_procedimento, valor: Number(r.valor), un: uidx[r.unidade_nome], st: su(r), qtd: Number(r.qtd||0) }); });
    const dmp = {}; ppRows.forEach(r => { const nom = r.profissional_proposta; if(!dmp[nom]) dmp[nom] = {}; const p = r.nome_procedimento; dmp[nom][p] = (dmp[nom][p]||0) + Number(r.valor); });
    return { dmd, dmp };
  }

  // Sob demanda: metrica valor_proposta (dia + por profissional), so'
  // usada quando o Status selecionado != Executada.
  async function loadPropostaMetrics(user, store){
    const [diaProp, profProp, pacProp] = await Promise.all([
      fetchAll("vw_dia_proposta", ["unidade_nome","status_proposta","dia"]).catch(() => []),
      fetchAll("vw_prof_dia_proposta", ["unidade_nome","status_proposta","profissional_proposta","dia"]).catch(() => []),
      fetchAll("vw_pacote_dia_proposta", ["unidade_nome","status_proposta","nome_pacote","dia"]).catch(() => [])
    ]);
    let dpRows = diaProp, ppfRows = profProp, pkRows = pacProp;
    if(!user.isMaster){
      dpRows = dpRows.filter(r => r.unidade_nome === user.unidade);
      ppfRows = ppfRows.filter(r => r.unidade_nome === user.unidade);
      pkRows = pkRows.filter(r => r.unidade_nome === user.unidade);
    }
    const uidx = {}; store.units.forEach((u,i) => uidx[u] = i);
    const sidx = {}; store.statuses.forEach((s,i) => sidx[s] = i);
    const su = r => sidx[r.status_proposta || "Sem status"];
    const duP = dpRows.map(r => [uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]);
    const dmProp = {}; ppfRows.forEach(r => { const k = r.profissional_proposta || "(sem profissional)"; (dmProp[k] = dmProp[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    const dmPacProp = {}; pkRows.forEach(r => { const k = r.nome_pacote || "Sem pacote"; (dmPacProp[k] = dmPacProp[k]||[]).push([uidx[r.unidade_nome], su(r), r.dia, Number(r.valor)]); });
    return { duP, dmProp, dmPacProp };
  }

  // stat: indice do UNICO status selecionado (nao soma mais de um -
  // valor_proposta e valor_final_item nao podem ser combinados).
  function buildPred(unis, stat, pmode, months, de, ate){
    return (u, s, d) => {
      if(unis.length > 0 && !unis.includes(u)) return false;
      if(s !== stat) return false;
      if(pmode === "mes") return months.includes(d.slice(0,7));
      return d >= de && d <= ate;
    };
  }
  function MultiSelect({ options, value, onChange, placeholder, searchable }){
    const [open, setOpen] = useState(false);
    const [q, setQ] = useState("");
    const ref = React.useRef(null);
    useEffect(() => {
      if(!open){ setQ(""); return; }
      const h = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener("mousedown", h);
      return () => document.removeEventListener("mousedown", h);
    }, [open]);
    const toggle = v => onChange(value.includes(v) ? value.filter(x => x !== v) : [...value, v]);
    const filtered = searchable && q.trim() ? options.filter(([,lbl2]) => lbl2.toLowerCase().includes(q.trim().toLowerCase())) : options;
    const allOn = value.length === options.length;
    const lbl = value.length === 0 ? placeholder : allOn ? "Todas" : value.length + " selecionado(s)";
    return html`<div style=${{position:"relative",display:"inline-block"}} ref=${ref}>
      <button onClick=${() => setOpen(o => !o)} style=${{height:"34px",border:"1px solid #d9d2c7",borderRadius:"9px",fontSize:"13px",padding:"0 10px 0 12px",background:"#fff",color:value.length?"#2b2a28":"#a59c8d",fontFamily:"inherit",cursor:"pointer",display:"flex",alignItems:"center",gap:"8px",minWidth:"180px",justifyContent:"space-between",whiteSpace:"nowrap"}}>
        <span>${lbl}</span><i class=${"ti ti-chevron-"+(open?"up":"down")} style=${{fontSize:"12px",color:"#a59c8d",flexShrink:0}}></i>
      </button>
      ${open ? html`<div style=${{position:"absolute",top:"38px",left:"0",background:"#fff",border:"1px solid #e3ded7",borderRadius:"10px",boxShadow:"0 8px 24px rgba(80,50,10,.14)",zIndex:200,minWidth:"210px",maxHeight:"320px",display:"flex",flexDirection:"column",padding:"0"}}>
        ${searchable ? html`<div style=${{padding:"8px 10px",borderBottom:"1px solid #f3eee6",flexShrink:0}}>
          <input autoFocus value=${q} onChange=${e => setQ(e.target.value)} placeholder="Buscar…" style=${{width:"100%",height:"30px",border:"1px solid #d9d2c7",borderRadius:"7px",padding:"0 10px",fontSize:"12.5px",fontFamily:"inherit",outline:"none",boxSizing:"border-box"}} onClick=${e => e.stopPropagation()} />
        </div>` : null}
        <div style=${{overflowY:"auto",flex:1,padding:"4px 0"}}>
          ${!q.trim() ? html`<label style=${{display:"flex",alignItems:"center",gap:"8px",padding:"7px 14px",cursor:"pointer",fontSize:"12.5px",color:"#6e675c",borderBottom:"1px solid #f3eee6",fontWeight:500}}>
            <input type="checkbox" checked=${allOn} onChange=${() => onChange(allOn ? [] : options.map(o => o[0]))} style=${{accentColor:AC,cursor:"pointer",width:"14px",height:"14px"}} />
            Todos
          </label>` : null}
          ${filtered.length === 0 ? html`<div style=${{padding:"10px 14px",fontSize:"12px",color:"#b8ad9c"}}>Nenhum resultado</div>` : null}
          ${filtered.map(([v,lbl2]) => html`<label key=${v} style=${{display:"flex",alignItems:"center",gap:"8px",padding:"6px 14px",cursor:"pointer",fontSize:"12.5px",color:"#2b2a28"}}>
            <input type="checkbox" checked=${value.includes(v)} onChange=${() => toggle(v)} style=${{accentColor:AC,cursor:"pointer",width:"14px",height:"14px"}} />
            ${lbl2}
          </label>`)}
        </div>
      </div>` : null}
    </div>`;
  }
  function aggDaily(store, pred){
    const m = {}, qp = {}, qi = {};
    store.du.forEach(([u,s,d,vf,qtdp,qtdi]) => { if(pred(u,s,d)){ m[d]=(m[d]||0)+vf; qp[d]=(qp[d]||0)+qtdp; qi[d]=(qi[d]||0)+qtdi; } });
    return Object.keys(m).sort().reverse().map(d => [d, m[d], qp[d], qi[d]]);
  }
  // 5o elemento da tupla (qtd) e' opcional - so' vw_proc_dia carrega hoje.
  // Vai como 3o item de cada [dia, valor] -> [dia, valor, qtd], sem quebrar
  // quem so' desestrutura [d,v] (elemento extra e' ignorado nesses casos).
  function aggEntity(data, pred){
    return Object.entries(data).map(([name, arr]) => {
      const days = {}, qdays = {};
      arr.forEach(([u,s,d,vf,qtd]) => { if(pred(u,s,d)){ days[d]=(days[d]||0)+vf; if(qtd!==undefined) qdays[d]=(qdays[d]||0)+qtd; } });
      const dl = Object.keys(days).sort().reverse().map(d => [d, days[d], qdays[d]||0]);
      return { name, days: dl, total: dl.reduce((s,r) => s+r[1], 0), qtdTotal: dl.reduce((s,r) => s+(r[2]||0), 0) };
    }).filter(e => e.days.length > 0).sort((a,b) => b.total - a.total);
  }

  // ===== Aba Comparação: meses fechados (2025-2026, exclui o mes corrente) =====
  function closedMonthsFrom(store){
    const today = new Date();
    const anoMesAtual = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
    const all = [...new Set(store.du.map(r => r[2].slice(0,7)))]
      .filter(ym => ym >= "2025-01" && ym <= "2026-12" && ym < anoMesAtual)
      .sort();
    return all.map(ym => [ym, monthLbl(ym)]);
  }
  // meses: array de "YYYY-MM" - permite comparar grupos com mais de um mes
  // (ex.: mes anterior = [jan/25,fev/25] x mes posterior = [jan/26,fev/26]).
  // stat: indice do status selecionado (igual ao resto do painel - um
  // unico status por vez, valor_final_item x valor_proposta nao se somam).
  function predGrupo(store, unis, meses, stat){
    return (u,s,d) => (unis.length===0||unis.includes(u)) && s===stat && meses.includes(d.slice(0,7));
  }
  function kpiGrupo(store, unis, meses, stat, isExecutada){
    const pred = predGrupo(store, unis, meses, stat);
    // qtd/dias sempre vem do grao item (qtd_propostas nao muda por metrica de valor);
    // vf vem de valor_final_item quando Executada, senao de valor_proposta (duP).
    let vf=0, qtd=0;
    store.du.forEach(([u,s,d,valor,qtdp]) => { if(pred(u,s,d)){ qtd+=qtdp; if(isExecutada) vf+=valor; } });

    let dias = 0;
    meses.forEach(ym => { const [y,m] = ym.split("-").map(Number); dias += new Date(y, m, 0).getDate(); });
    return { vf, qtd, ticket: qtd?vf/qtd:0, media: dias?vf/dias:0, dias };
  }

  // valueType "brl" (padrao, valores em dinheiro) ou "count" (quantidade,
  // sem "R$" - ex.: Propostas por status)
  function Chartjs({ labels, data, horizontal, height, valueType }){
    const ref = React.useRef(null), inst = React.useRef(null);
    const sig = labels.join("|") + "#" + data.map(n => Math.round(n)).join(",");
    const fmtTip = valueType === "count" ? (v => v.toLocaleString("pt-BR")) : brl;
    useEffect(() => {
      if(!ref.current || !window.Chart) return;
      if(inst.current){ inst.current.destroy(); inst.current = null; }
      inst.current = new Chart(ref.current, {
        type: "bar",
        data: { labels, datasets: [{ data, backgroundColor: AC, hoverBackgroundColor: "#cf7400", borderRadius: 4, maxBarThickness: horizontal ? 16 : 30 }] },
        options: {
          indexAxis: horizontal ? "y" : "x",
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 350 },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtTip(Number(c.raw)) } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: "#a59c8d", maxRotation: 0, autoSkip: true, maxTicksLimit: horizontal ? 6 : 16 } },
            y: { grid: { color: "#f3eee6" }, ticks: { font: { size: 10 }, color: "#a59c8d", autoSkip: !horizontal ? false : true } }
          }
        }
      });
      return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
    }, [sig, horizontal]);
    return html`<div class="chartbox" style=${{ height: (height||230)+"px" }}><canvas ref=${ref}></canvas></div>`;
  }

  // Grafico combinado (mes anterior x mes posterior) - dia do mes no eixo X.
  // Mes anterior = coluna (barra), mes posterior = linha, conforme pedido.
  // Componente separado do Chartjs (que so faz barra simples) pra nao
  // arriscar quebrar os graficos existentes.
  function ComboChartjs({ labels, dataBar, dataLine, labelBar, labelLine, height }){
    const ref = React.useRef(null), inst = React.useRef(null);
    const sig = labels.join(",") + "#" + dataBar.map(n=>Math.round(n||0)).join(",") + "#" + dataLine.map(n=>Math.round(n||0)).join(",");
    useEffect(() => {
      if(!ref.current || !window.Chart) return;
      if(inst.current){ inst.current.destroy(); inst.current = null; }
      inst.current = new Chart(ref.current, {
        type: "bar",
        data: { labels, datasets: [
          { type: "bar", label: labelBar, data: dataBar, backgroundColor: "#b8ad9c", hoverBackgroundColor: "#a59c8d", borderRadius: 4, maxBarThickness: 22, order: 2 },
          { type: "line", label: labelLine, data: dataLine, borderColor: AC, backgroundColor: AC, pointRadius: 2, tension: .25, order: 1 }
        ] },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 350 },
          plugins: { legend: { display: true, position: "top", labels: { boxWidth: 12, font: { size: 11 }, color: "#6e675c" } }, tooltip: { callbacks: { label: c => c.dataset.label+": "+brl(Number(c.raw)) } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: "#a59c8d", maxRotation: 0, autoSkip: true, maxTicksLimit: 16 } },
            y: { grid: { color: "#f3eee6" }, ticks: { font: { size: 10 }, color: "#a59c8d" } }
          }
        }
      });
      return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
    }, [sig]);
    return html`<div class="chartbox" style=${{ height: (height||260)+"px" }}><canvas ref=${ref}></canvas></div>`;
  }

          </div>`)}
        </div>
        <div style=${{padding:"11px 20px",borderTop:"1px solid #eee6da",flexShrink:0,background:"#fcfbf9",display:"flex",alignItems:"center",justifyContent:"center",gap:"7px"}}>
          <i class="ti ti-sun" style=${{fontSize:"14px",color:"#E8830F"}}></i>
          <span style=${{fontSize:"12px",color:"#8a8378"}}>Dados atualizados automaticamente todos os dias às 8h</span>
        </div>
      </div>
    </div>`;
  }
  function Dashboard({ user, store, ensureProfProc, ensurePropostaMetrics, onLogout }){
    const [page, setPage] = useState("geral");
    const [showNotes, setShowNotes] = useState(false);
    const [unis, setUnis] = useState([]);
    const [stat, setStat] = useState(store.statExecutada >= 0 ? store.statExecutada : 0);
    const [fProfs, setFProfs] = useState([]);
    const [fProcs, setFProcs] = useState([]);
    const [pmode, setPmode] = useState("mes");
    const [months, setMonths] = useState(() => {
      const today = new Date();
      const ymAtual = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
      return store.months.some(m => m[0]===ymAtual) ? [ymAtual] : store.months.map(m => m[0]);
    });
    const [de, setDe] = useState(store.dmin);
    const [ate, setAte] = useState(store.dmax);
    const statusAtual = store.statuses[stat];
    const isExecutada = statusAtual === "Executada";
    // Dados sob demanda: so' busca quando realmente preciso (aba de
    // drill-down aberta, ou status != Executada selecionado).
    useEffect(() => { if(page==="prof" || page==="proc") ensureProfProc(); }, [page]);
    useEffect(() => { if(!isExecutada) ensurePropostaMetrics(); }, [isExecutada]);
    // Procedimentos - Detalhado so' faz sentido em Executada (valor_proposta
    // nao da pra dividir por procedimento) - trava o Status ao entrar na aba.
    useEffect(() => { if(page==="proc" && store.statExecutada>=0 && stat!==store.statExecutada) setStat(store.statExecutada); }, [page]);
    const propMetricsLoading = !isExecutada && store.duP === null;
    const profProcLoading = (page==="prof" || page==="proc") && store.dmd === null;
    const pred = buildPred(unis, stat, pmode, months, de, ate);
    const dailyItem = aggDaily(store, pred);
    const daily = isExecutada ? dailyItem : (() => {
      const propMap = aggDailyProposta({ duP: store.duP||[] }, pred);
      return dailyItem.map(([d,vf,qp,qi]) => [d, propMap[d]||0, qp, qi]);
    })();
    const prof = aggEntity(isExecutada ? store.dm : (store.dmProp||{}), pred);
    const proc = aggEntity(store.dproc, pred);
    const procSemValor = proc;
    const pac = aggEntity(isExecutada ? (store.dpac || {}) : (store.dmPacProp || {}), pred);
    const statusChart = propostasPorStatus(store, unis, pmode, months, de, ate);
    const profOpts = [...new Set(Object.keys(store.dmd||{}).map(k => k.split("||")[0]))].sort().map(m => [m, m]);
    const procOpts = Object.keys(store.dproc||{}).sort().map(p => [p, p]);
    const periodOk = d => pmode === "mes" ? months.includes(d.slice(0,7)) : (d >= de && d <= ate);
    // KPI calculado 100% no navegador, a partir do mesmo "daily" que
    // alimenta "Totais Gerais" - antes vinha de uma funcao no banco
    // (kpis()) que so aceitava 1 unidade por vez; com 2+ unidades
    // marcadas (nem todas, nem so' 1) ela caia pra "sem filtro" e somava
    // TODAS as unidades, inflando o Valor Final em relacao ao Total
    // geral (que sempre foi calculado aqui no cliente, corretamente).
    const dias = periodDays(pmode, months, de, ate, store.calMin, store.calMax);
    const kpi = {
      vf: daily.reduce((s,r) => s+r[1], 0),
      qtd: daily.reduce((s,r) => s+r[2], 0),
      itens: daily.reduce((s,r) => s+r[3], 0),
      dias: dias.length,
    };
    const dchart = daily.slice().reverse();
    const ini = (user.isMaster ? "D" : (user.unidade||"U")).replace("Unidade ","").charAt(0).toUpperCase(); // MODO DEMO: prefixo ficticio; logo.svg (neutro) no header abaixo
    return html`<div>
      ${showNotes ? html`<${PatchNotes} onClose=${() => setShowNotes(false)} />` : null}
      <div class="hdr">
        <div class="hdr-l"><img class="logo" src="logo.svg" alt="Clínica Demo" /><b>Painel de Propostas</b></div>
        <div class="hdr-r"><button class=${"lo"+(showNotes?"":" lo-pulse")} onClick=${() => setShowNotes(true)} aria-label="Novidades" title="Ver novidades"><span class="inbox-ico"></span></button><span class="chip"><span class="av">${ini}</span>${user.isMaster ? "diretoria" : user.login}</span><button class="lo" onClick=${onLogout} aria-label="Sair"><i class="ti ti-logout"></i></button></div>
      </div>
      <div class="body">
        <div class="side">
          <div class="side-t">Páginas</div>
          <div class=${"nav"+(page==="geral"?" active":"")} onClick=${() => setPage("geral")}><i class="ti ti-layout-dashboard"></i>Análise Geral</div>
          <div class=${"nav"+(page==="prof"?" active":"")} onClick=${() => setPage("prof")}><i class="ti ti-user"></i>Profissionais - Detalhado</div>
          <div class=${"nav"+(page==="proc"?" active":"")} onClick=${() => setPage("proc")}><i class="ti ti-clipboard-list"></i>Procedimentos - Detalhado</div>
          <div class=${"nav"+(page==="pac"?" active":"")} onClick=${() => setPage("pac")}><i class="ti ti-package"></i>Pacotes - Detalhado</div>
          <div class=${"nav"+(page==="comp"?" active":"")} onClick=${() => setPage("comp")}><i class="ti ti-chart-line"></i>Comparação</div>
        </div>
        <div class="main">
          ${page==="comp" ? html`<${Comparacao} store=${store} ensurePropostaMetrics=${ensurePropostaMetrics} />` : html`<${React.Fragment}>
          <${FilterBar} store=${store} user=${user} unis=${unis} setUnis=${setUnis} stat=${stat} setStat=${setStat} pmode=${pmode} setPmode=${setPmode} months=${months} setMonths=${setMonths} de=${de} setDe=${setDe} ate=${ate} setAte=${setAte} page=${page} fProfs=${fProfs} setFProfs=${setFProfs} profOpts=${profOpts} fProcs=${fProcs} setFProcs=${setFProcs} procOpts=${procOpts} />
          <div class="canvas">
        ${page==="geral" ? html`<${React.Fragment}>
          ${propMetricsLoading ? html`<div class="visual" style=${{padding:"10px 16px",color:"#8a8378",fontSize:"12.5px"}}><i class="ti ti-loader"></i> Carregando dados desse status pela primeira vez…</div>` : null}
          <${Kpis} kpi=${kpi} taxa=${taxaDoStatus(statusChart, statusAtual)} />
          <div class="visual">
            <div class="visual-h"><i class="ti ti-chart-bar"></i>Valor por dia (Propostas)</div>
            <${Chartjs} labels=${dchart.map(r=>ddmm(r[0]))} data=${dchart.map(r=>r[1])} height=${230} />
          </div>
          <div class="visual">
            <div class="visual-h"><i class="ti ti-list-check"></i>Propostas por status <small>· quantidade de propostas</small></div>
            <${Chartjs} horizontal=${true} valueType="count" labels=${statusChart.map(s=>s.name)} data=${statusChart.map(s=>s.qtd)} height=${Math.max(120, statusChart.length*40)} />
          </div>
          <div class="grid2">
            <${Matrix} title="Por profissional (solicitante)" icon="ti-user" entities=${prof} nameHead="Profissional" />
            ${isExecutada ? html`<${Matrix} title="Por procedimento" icon="ti-clipboard-list" entities=${proc} nameHead="Procedimento" />` : html`<${ProcCanceladoList} entities=${procSemValor} />`}
          </div>
          <${Matrix} title="Por pacote" icon="ti-package" entities=${pac} nameHead="Pacote" />
          <${TotalTable} daily=${daily} />
        </>` : null}
        ${page==="prof" ? (profProcLoading ? html`<div class="visual"><div style=${{padding:"30px 16px",color:"#8a8378"}}><i class="ti ti-loader"></i> Carregando detalhes de profissionais…</div></div>` : html`<${ProfissionaisDetailPage} entities=${prof} dmd=${store.dmd} dmp=${store.dmp} unis=${unis} stat=${stat} fProcs=${fProcs} periodOk=${periodOk} />`) : null}
        ${page==="proc" ? (profProcLoading ? html`<div class="visual"><div style=${{padding:"30px 16px",color:"#8a8378"}}><i class="ti ti-loader"></i> Carregando detalhes de procedimentos…</div></div>` : html`<${ProcedimentosDetailPage} entities=${proc} dmd=${store.dmd} pred=${pred} fProfs=${fProfs} topProfs=${prof} isExecutada=${isExecutada} />`) : null}
        ${page==="pac" ? html`<${PacotesDetailPage} user=${user} store=${store} unis=${unis} pmode=${pmode} months=${months} de=${de} ate=${ate} statusAtual=${statusAtual} isExecutada=${isExecutada} pred=${pred} />` : null}
          </div>
        </>`}
        </div>
      </div>
    </div>`;
  }
  function Login({ onLogin, err, busy }){
    const [u, setU] = useState("diretoria"); const [p, setP] = useState("demo"); // MODO DEMO: pre-preenchido (qualquer login entra)
    // Enquanto o login esta na tela, tira a aparencia de "caixa" do
    // container .pbx (ver CSS body.login-mode) - some sozinho quando o
    // componente sai da tela, ou seja, assim que o usuario entra.
    useEffect(() => {
      document.body.classList.add("login-mode");
      return () => document.body.classList.remove("login-mode");
    }, []);
    const go = () => { if(!busy && u.trim() && p) onLogin(u, p); };
    // MODO DEMO: logo neutro (logo.svg) e placeholder ficticio abaixo.
    return html`<div class="gate"><div class="gate-card">
      <img class="logo" src="logo.svg" alt="Clínica Demo" />
      <p class="gate-sub">Painel de Propostas</p>
      <label>Login</label>
      <input type="text" value=${u} onChange=${e => setU(e.target.value)} onKeyDown=${e => e.key==="Enter" && go()} placeholder="ex.: centro" />
      <label>Senha</label>
      <input type="password" value=${p} onChange=${e => setP(e.target.value)} onKeyDown=${e => e.key==="Enter" && go()} placeholder="••••••" />
      <button class="btn" onClick=${go} disabled=${busy}>${busy ? "Entrando..." : "Entrar"}</button>
      <div class="err">${err}</div>
      <div class="hint">Use o login da sua unidade (ou diretoria)</div>
    </div></div>`;
  }
  // So' pra teste local (protótipo) - em producao (dominio real) o hostname
  // nunca bate com nenhum desses, entao o login normal continua obrigatorio.
  const DEV_HOSTS = ["localhost", "127.0.0.1", ""];
  const isDevHost = true; // MODO DEMO: entra direto como master, pelo fluxo de prototipo do proprio app
  function App(){
    const [user, setUser] = useState(null);
    const [store, setStore] = useState(null);
    const [err, setErr] = useState("");
    const [busy, setBusy] = useState(false);
    const [devLoading, setDevLoading] = useState(isDevHost);
    const inFlight = React.useRef({}); // evita disparar o mesmo fetch sob-demanda 2x
    useEffect(() => {
      if(!isDevHost) return;
      const u = { login: "prototipo", unidade: null, isMaster: true };
      loadCore(u).then(s => { setUser(u); setStore(s); setDevLoading(false); });
    }, []);
    async function onLogin(login, pwd){
      setBusy(true); setErr("");
      try {
        const lg = login.trim().toLowerCase();
        const email = lg.includes("@") ? lg : lg + DOMINIO;
        const { data, error } = await sbAuth.auth.signInWithPassword({ email, password: pwd });
        if(error) throw new Error("Login ou senha inválidos.");
        const { data: m } = await sbAuth.from("app_user_unidade").select("unidade_nome,is_master").eq("user_id", data.user.id).maybeSingle();
        if(!m) throw new Error("Usuário sem unidade vinculada (verifique o mapeamento).");
        const u = { login: lg, unidade: m.unidade_nome, isMaster: !!m.is_master };
        const s = await loadCore(u);
        setUser(u); setStore(s);
      } catch(e){ setErr(e.message || "Falha ao entrar."); }
      finally { setBusy(false); }
    }
    function logout(){ sbAuth.auth.signOut(); setUser(null); setStore(null); setErr(""); }
    // ensureX: so busca se ainda nao foi buscado (campo null) e nao ha um fetch em andamento
    const ensureProfProc = () => {
      if(!store || store.dmd !== null || inFlight.current.profProc) return;
      inFlight.current.profProc = true;
      loadProfProc(user, store).then(extra => {
        inFlight.current.profProc = false;
        setStore(s => ({ ...s, ...extra }));
      });
    };
    const ensurePropostaMetrics = () => {
      if(!store || store.duP !== null || inFlight.current.propMetrics) return;
      inFlight.current.propMetrics = true;
      loadPropostaMetrics(user, store).then(extra => {
        inFlight.current.propMetrics = false;
        setStore(s => ({ ...s, ...extra }));
      });
    };
    if(user && store) return html`<${Dashboard} user=${user} store=${store} ensureProfProc=${ensureProfProc} ensurePropostaMetrics=${ensurePropostaMetrics} onLogout=${logout} />`;
    if(devLoading || (user && !store)) return html`<div style=${{padding:"40px",textAlign:"center",color:"#8a8378"}}>Carregando…</div>`;
    return html`<${Login} onLogin=${onLogin} err=${err} busy=${busy} />`;
  }
  ReactDOM.createRoot(document.getElementById("pbx-root")).render(html`<${App} />`);
</script>
</body>
</html>
