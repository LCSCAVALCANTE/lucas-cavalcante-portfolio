<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo ilustrativo da extensão InsertValue em execução no Feegow</title>
  <desc id="desc">Tela fictícia de atualização em massa com o popup da extensão e o painel de seleção de planos por lote.</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffb21c"/><stop offset=".45" stop-color="#f04422"/><stop offset="1" stop-color="#e7182d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#10243e" flood-opacity=".16"/></filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#6b7789}.label{fill:#28364a;font-size:14px;font-weight:600}.small{font-size:12px}.btn{fill:#1677d2}.btntext{fill:#fff;font-size:14px;font-weight:700}.line{stroke:#dfe5ed}.input{fill:#fff;stroke:#ccd5df}.tablehead{fill:#eef3f8}.title{fill:#15243a;font-size:24px;font-weight:750}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#eef2f6"/>
  <rect width="1440" height="70" fill="#163b64"/>
  <rect x="28" y="18" width="34" height="34" rx="9" fill="url(#brand)"/>
  <path d="M37 37h7l4-8 7 15 4-7h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="43" class="ui" fill="#fff" font-size="20" font-weight="700">F-CLINIC</text>
  <text x="1260" y="42" class="ui" fill="#dce8f4" font-size="14">Ambiente demonstrativo</text>

  <rect x="0" y="70" width="220" height="830" fill="#fff"/>
  <text x="28" y="120" class="ui muted small">CONFIGURAÇÕES</text>
  <rect x="16" y="142" width="188" height="44" rx="9" fill="#e8f2fc"/>
  <text x="30" y="170" class="ui" fill="#1677d2" font-size="14" font-weight="700">Valores em massa</text>
  <text x="30" y="218" class="ui muted" font-size="14">Planos</text>
  <text x="30" y="258" class="ui muted" font-size="14">Procedimentos</text>
  <text x="30" y="298" class="ui muted" font-size="14">Tabelas</text>

  <text x="260" y="120" class="ui title">Atualização de valores em massa</text>
  <text x="260" y="148" class="ui muted" font-size="14">Procedimentos e planos • alterações pendentes de conferência</text>
  <rect x="260" y="176" width="1140" height="650" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="290" y="220" class="ui" fill="#15243a" font-size="17" font-weight="700">Consulta convênio</text>
  <rect x="290" y="245" width="1080" height="46" rx="7" class="tablehead"/>
  <text x="310" y="273" class="ui label">Plano</text><text x="585" y="273" class="ui label">Código</text><text x="750" y="273" class="ui label">Valor</text><text x="940" y="273" class="ui label">Val. CH</text><text x="1130" y="273" class="ui label">Situação</text>
  <g class="ui" font-size="14" fill="#354256">
    <line x1="290" y1="345" x2="1370" y2="345" class="line"/><text x="310" y="326">Plano Alpha</text><text x="585" y="326">001</text><rect x="730" y="306" width="140" height="30" rx="5" class="input"/><text x="748" y="326">150,00</text><rect x="920" y="306" width="140" height="30" rx="5" class="input"/><text x="938" y="326">0</text><text x="1130" y="326" fill="#219653">Atualizado</text>
    <line x1="290" y1="399" x2="1370" y2="399" class="line"/><text x="310" y="380">Plano Beta</text><text x="585" y="380">002</text><rect x="730" y="360" width="140" height="30" rx="5" class="input"/><text x="748" y="380">150,00</text><rect x="920" y="360" width="140" height="30" rx="5" class="input"/><text x="938" y="380">0</text><text x="1130" y="380" fill="#219653">Atualizado</text>
    <line x1="290" y1="453" x2="1370" y2="453" class="line"/><text x="310" y="434">Plano Gamma</text><text x="585" y="434">003</text><rect x="730" y="414" width="140" height="30" rx="5" class="input"/><text x="748" y="434">125,00</text><rect x="920" y="414" width="140" height="30" rx="5" class="input"/><text x="938" y="434">0</text><text x="1130" y="434" class="muted">Sem alteração</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1025" y="95" width="360" height="324" rx="16" fill="#fff" stroke="#d8e0e9"/>
    <rect x="1047" y="116" width="30" height="30" rx="8" fill="url(#brand)"/>
    <path d="M1055 132h6l3-7 6 13 3-6h5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="1090" y="137" class="ui" fill="#15243a" font-size="16" font-weight="750">InsertValue on F-CLINIC</text>
    <text x="1047" y="173" class="ui label">Atualização de valores em massa</text>
    <rect x="1047" y="190" width="316" height="38" rx="7" class="btn"/><text x="1066" y="214" class="ui btntext">Alterar dados por plano</text>
    <text x="1047" y="252" class="ui muted small">PROCEDIMENTO</text><rect x="1047" y="260" width="316" height="36" rx="6" class="input"/><text x="1060" y="283" class="ui" fill="#3d4b5e" font-size="13">Consulta convênio</text>
    <text x="1047" y="318" class="ui muted small">PLANO</text><rect x="1047" y="326" width="150" height="36" rx="6" class="input"/><text x="1060" y="349" class="ui" fill="#3d4b5e" font-size="13">Plano Alpha</text>
    <text x="1213" y="318" class="ui muted small">NOVO VALOR</text><rect x="1213" y="326" width="150" height="36" rx="6" class="input"/><text x="1226" y="349" class="ui" fill="#3d4b5e" font-size="13">150,00</text>
    <rect x="1047" y="376" width="316" height="30" rx="7" fill="#2eaa64"/><text x="1180" y="396" class="ui btntext">Executar</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="485" width="360" height="270" rx="15" fill="#fff" stroke="#d8e0e9"/>
    <text x="1033" y="521" class="ui" fill="#15243a" font-size="16" font-weight="750">Seleção de planos por lote</text><rect x="1323" y="502" width="25" height="25" rx="6" fill="#f2f4f7"/><text x="1331" y="520" class="ui" fill="#536174" font-size="13" font-weight="700">X</text>
    <text x="1033" y="552" class="ui muted" font-size="13">Navegue pela lista em grupos de 50 planos.</text>
    <rect x="1033" y="574" width="69" height="34" rx="7" fill="#edf2f7"/><text x="1048" y="596" class="ui label small">Início</text>
    <rect x="1110" y="574" width="76" height="34" rx="7" fill="#edf2f7"/><text x="1122" y="596" class="ui label small">Anterior</text>
    <rect x="1194" y="574" width="76" height="34" rx="7" class="btn"/><text x="1205" y="596" class="ui btntext small">Próximo</text>
    <rect x="1278" y="574" width="70" height="34" rx="7" fill="#edf2f7"/><text x="1289" y="596" class="ui label small">Resetar</text>
    <text x="1033" y="645" class="ui label">Lote</text><rect x="1081" y="622" width="78" height="34" rx="6" class="input"/><text x="1115" y="644" class="ui" fill="#354256" font-size="13">3</text><rect x="1171" y="622" width="54" height="34" rx="7" class="btn"/><text x="1189" y="644" class="ui btntext small">Ir</text>
    <rect x="1033" y="680" width="315" height="48" rx="8" fill="#eaf7ef"/><circle cx="1055" cy="704" r="8" fill="#2eaa64"/><path d="m1051 704 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="1073" y="709" class="ui" fill="#217a48" font-size="13" font-weight="650">Selecionados 101 até 150.</text>
  </g>

  <rect x="260" y="846" width="820" height="30" rx="15" fill="#dae4ee"/><text x="282" y="866" class="ui" fill="#5c6c7e" font-size="12">Ilustração de portfólio com dados fictícios — a extensão atua diretamente sobre a tela ativa do Feegow.</text>
</svg>
